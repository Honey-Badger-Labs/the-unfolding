<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Unfolding Prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2304040b%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%23e8b563%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273%27 fill=%27%23ece8df%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-bleed particle canvas; one instrument strip pinned to the bottom. Single dark theme by choice. */
  color-scheme: dark;
  --void:#04040b;
  --ink:#ece8df;
  --dim:#8f8c9c;
  --line:rgba(236,232,223,.16);
  --gold:#e8b563;
  --observed:#7fd6ff;
  --model:#f2a55c;
  --art:#e07bd0;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--mono);font-size:12px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mark{position:fixed;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--dim);pointer-events:none}
.mark b{color:var(--ink);font-weight:500}
.hud{position:fixed;left:0;right:0;bottom:0;padding:44px 16px 16px;background:linear-gradient(to top,rgba(4,4,11,.92) 35%,rgba(4,4,11,0));display:flex;flex-direction:column;gap:12px}
.inner{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.read{display:flex;flex-direction:column;justify-content:flex-start;gap:6px;--ease:cubic-bezier(.16,1,.3,1)}
/* a hidden copy used to measure the tallest stage text, so the panel never changes height */
.measure{position:absolute;left:0;right:0;top:0;visibility:hidden;pointer-events:none}
/* text arrives after the visuals settle: heading first, then era and scale, label, note, sources.
   It leaves in reverse, note first and heading last, before the next visual transition. */
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;opacity:0;filter:blur(12px);transform:translate(var(--dx),var(--dy)) scale(1.8);
  transition:opacity 1.6s var(--ease),filter 1.8s var(--ease),transform 2.2s var(--ease);transition-delay:calc(var(--i)*70ms)}
.read.in .c{opacity:1;filter:blur(0);transform:none}
.read.out .c{opacity:0;filter:blur(10px);transform:translate(calc(var(--dx)*-1.6),calc(var(--dy)*-1.6)) scale(.5);
  transition-duration:1s;transition-timing-function:ease-in;transition-delay:calc(.5s + var(--r)*.5s)}
.meta{opacity:0;filter:blur(6px);transform:translateY(.6em);transition:opacity 1.4s var(--ease),filter 1.6s var(--ease),transform 1.8s var(--ease);transition-delay:var(--meta-at,1.6s)}
.read.in .meta{opacity:1;filter:blur(0);transform:none}
.read.out .meta{opacity:0;transition-duration:.7s;transition-delay:.3s}
.chip{clip-path:inset(0 100% 0 0);transition:clip-path 1.2s var(--ease);transition-delay:var(--chip-at,2.2s)}
.read.in .chip{clip-path:inset(0 0 0 0)}
.read.out .chip{clip-path:inset(0 0 0 100%);transition-duration:.6s;transition-delay:.4s}
.nw{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.5em);
  transition:opacity 1.2s var(--ease),filter 1.2s var(--ease),transform 1.4s var(--ease);transition-delay:calc(var(--note-at,2.8s) + var(--i)*75ms)}
.read.in .nw{opacity:1;filter:blur(0);transform:none}
.read.out .nw{opacity:0;filter:blur(6px);transition-duration:.6s;transition-delay:0s}
.src{opacity:0;transition:opacity 1.2s ease}
.read.in .src{opacity:1;transition-delay:var(--src-at,5s)}
.read.out .src{opacity:0;transition-duration:.4s;transition-delay:0s}
@media (prefers-reduced-motion:reduce){
  .c,.nw,.meta,.chip,.src{filter:none!important;transform:none!important;clip-path:none!important;transition:opacity .3s!important}
}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(26px,5.2vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.chip{border:1px solid currentColor;border-radius:2px;padding:2px 7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.chip.observed{color:var(--observed)}
.chip.model{color:var(--model)}
.chip.art{color:var(--art)}
.meta{color:var(--dim)}
.meta span{color:var(--ink)}
.note{margin:0;max-width:62ch;color:var(--dim)}
.ctl{display:flex;align-items:center;gap:12px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:9px 12px;min-width:68px;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-size:10px}
button:hover{border-color:var(--gold);color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.track{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);margin-top:-9px;box-shadow:0 0 18px rgba(232,181,99,.7)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--gold);box-shadow:0 0 18px rgba(232,181,99,.7)}
.ticks{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ticks i{font-style:normal}
.src{margin:0;font-size:10px;letter-spacing:.04em;color:var(--dim)}
.src a{color:var(--dim);text-decoration:underline;text-underline-offset:2px}
.src a:hover{color:var(--gold)}
.fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
@media (max-width:760px){.ticks i:not(:first-child):not(:last-child){display:none}}
@media (max-width:520px){.note{font-size:11px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Particle field that changes shape as you move through cosmic time"></canvas>
<div class="mark"><span><b>The Unfolding</b></span><span id="fps">prototype 2.1</span></div>

<div class="hud">
  <div class="inner">
    <div class="read in" id="read">
      <div class="row"><h1 id="title">The Unfolding</h1><span class="chip model" id="chip">Model-dependent</span></div>
      <div class="meta row"><span id="era">13.8 billion years</span><span aria-hidden="true">/</span><span id="scale">one universe</span></div>
      <p class="note" id="note">Loading the Atlas.</p>
      <p class="src" id="src"></p>
    </div>
    <div class="ctl">
      <button id="play" type="button">Play</button>
      <div class="track">
        <input id="t" type="range" min="0" max="10" step="0.001" value="0" aria-label="Position in the journey">
        <div class="ticks" id="ticks"></div>
      </div>
      <button id="snd" type="button" aria-pressed="false" title="Sound (M)">Sound</button>
      <button id="q" type="button" title="Particle count">120k</button>
    </div>
  </div>
</div>
<div class="fail" id="fail">This prototype needs WebGL2. Open it in a current version of Chrome, Safari, Edge or Firefox.</div>

<script src="audio.js"></script>
<script>
(function(){
"use strict";

var VS=`#version 300 es
precision highp float;
layout(location=0) in vec4 aSeed;
uniform float uT,uTime,uAspect,uPx,uCam,uAlpha,uShift,uPass,uZoom;
uniform vec2 uField;
out vec3 vCol;
out float vA;
const float PI=3.14159265;
const float TAU=6.2831853;
const int HEART=5;
const int GIANT=10;
// the galaxy in the protocluster that the camera flies into
const vec3 FC=vec3(.55,-.32,.35);
// a planetary system like ours: four small rocky worlds, then giants beyond the frost line
const float PR[8]=float[8](.3,.42,.56,.72,1.2,1.62,2.05,2.42);
const float PS[8]=float[8](.008,.013,.014,.010,.05,.042,.028,.027);
const vec3 PC[8]=vec3[8](vec3(.6,.55,.5),vec3(.95,.8,.5),vec3(.3,.55,1.),vec3(.9,.4,.25),vec3(.9,.7,.5),vec3(.95,.85,.6),vec3(.6,.9,.95),vec3(.3,.45,1.));
vec3 s,r2,r3,g; float w;
float gq=1.;   // how far the galaxy has formed; below 1 only while it forms
float wq=1.;   // how far the planets have formed; below 1 only while they form
vec3 hash33(vec3 p){
  p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));
  return fract(sin(p)*43758.5453);
}
float hash13(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
vec3 flow(vec3 p,float t){
  return vec3(sin(p.y*1.7+t)+sin(p.z*2.3-t*.7),sin(p.z*1.9+t*.8)+sin(p.x*2.1+t),sin(p.x*1.5-t)+sin(p.y*2.7+t*.6));
}
mat2 rot(float a){float c=cos(a),s_=sin(a);return mat2(c,-s_,s_,c);}
float ease(float x){x=clamp(x,0.,1.);return x*x*x*(x*(x*6.-15.)+10.);}
vec3 nodePos(vec3 c){return (c+.5+(hash33(c)-.5)*.85)*.9;}

void energy(out vec3 P,out vec3 C,out float S,out float A){
  // primordial energy: fills the view, no centre
  P=(s*2.-1.)*vec3(uField,2.2);
  P+=flow(P*1.1,uTime*.6)*.22;
  float n0=.5+.5*sin(P.x*1.3+P.y*1.9+P.z*1.1+uTime*.4);
  C=mix(vec3(1.,.42,.1),vec3(1.,.14,.55),n0)+vec3(.7,.62,.5)*r2.x*r2.x;
  S=.03+.05*r2.y; A=.5;
}

void web(out vec3 P,out vec3 C,out float S,out float A){
  // cosmic web: jittered nodes joined by curved filaments
  vec3 c=floor((s*2.-1.)*3.);
  vec3 na=nodePos(c);
  float di=floor(r2.x*6.);
  vec3 d=di<1.?vec3(1,0,0):di<2.?vec3(-1,0,0):di<3.?vec3(0,1,0):di<4.?vec3(0,-1,0):di<5.?vec3(0,0,1):vec3(0,0,-1);
  vec3 cb=c+d;
  vec3 nb=nodePos(cb);
  vec3 em=(c+cb)*.5;
  float isFil=step(.32,hash13(em*3.7+1.3))*step(.18,r2.y);
  float u=r2.z;
  vec3 curve=(hash33(em*5.1)-.5)*.55*sin(PI*u);
  vec3 Pf=mix(na,nb,u)+curve+g*.03*(1.+2.5*r3.x*r3.x);
  vec3 Pn=na+g*(.07+.3*r3.y*r3.y*r3.y);
  P=mix(Pn,Pf,isFil);
  C=mix(vec3(1.,.7,.34),mix(vec3(.2,.3,1.),vec3(.25,.7,1.),r3.z),isFil);
  S=mix(.03,.024,isFil); A=mix(.5,.95,isFil);
  // the node we will fly into: a dense, bright knot
  float home=(1.-isFil)*step(dot(abs(c),vec3(1.)),.5);
  P=mix(P,na+g*.09,home);
  C=mix(C,vec3(1.,.92,.8)*1.3,home);
  A=mix(A,.9,home);
  P.xz=rot(uTime*.04)*P.xz;
}

void protocluster(out vec3 P,out vec3 C,out float S,out float A){
  // a cluster still assembling: dozens of young galaxies with empty space between them
  float kind=r3.z;
  if(kind<.06){
    P=g*vec3(1.3,1.,1.); C=vec3(.35,.3,.6)*.2; S=.05; A=.25;
  }else if(kind<.13){
    // faint galaxies far behind the cluster
    P=(s*2.-1.)*vec3(3.4,2.1,1.5); C=mix(vec3(.9,.7,.5),vec3(.6,.7,1.),r2.x)*.55; S=.012; A=.5;
  }else{
    float u=r2.z;
    float id=u<.1?0.:u<.22?1.:2.+floor(r2.x*60.);
    vec3 h=hash33(vec3(id,11.,4.));
    vec3 c=id<.5?FC:id<1.5?vec3(-.3,.12,-.2):normalize(h-.5+1e-4)*2.4*pow(hash13(vec3(id,3.,3.)),.6);
    float sz=id<.5?.12:id<1.5?.2:.06+.1*h.x;
    vec3 q=g;
    q.z*=h.y<.5?.3:.85;
    q.xy=rot(h.z*TAU)*q.xy; q.yz=rot(h.x*3.)*q.yz;
    P=c+q*sz;
    C=mix(vec3(.55,.7,1.15),vec3(1.,.75,.45),step(.55,h.y))*(.6+.5*r3.x);
    if(id<.5)C=mix(vec3(.6,.75,1.3),vec3(1.2,.5,.8),r3.x);
    if(id>.5&&id<1.5)C=vec3(1.,.82,.6);
    S=.024; A=id<.5?.22:id<1.5?.14:.2;
  }
}

void youngGalaxy(out vec3 P,out vec3 C,out float S,out float A){
  // a young, gas-rich galaxy mid-merger: giant star-forming clumps, tidal tails,
  // a blinding core fed by infalling gas, and twin jets
  float kind=r3.z;
  if(r2.y<.05){
    P=g*.04; C=vec3(1.3,1.35,1.5); S=.032; A=.9;
  }else if(r2.x<.18){
    float side=r3.y<.5?1.:-1.;
    float h=fract(r2.z+uTime*.1*(.6+r3.x));
    float wj=.015+.1*h*h+.35*smoothstep(.8,1.,h);
    P=vec3(g.x*wj,g.y*wj,side*(.08+2.8*h));
    C=mix(vec3(.8,.9,1.2),vec3(.45,.4,1.),h)*(1.-.55*h);
    S=.018; A=.7;
  }else if(kind<.4){
    float id=floor(r2.z*7.);
    vec3 h=hash33(vec3(id,2.,5.));
    float cr=.4+1.2*h.x;
    float ca=h.y*TAU+uTime*.12/(cr+.3);
    P=(vec3(cr*cos(ca),cr*sin(ca),(h.z-.5)*.3)+g*(.12+.16*h.z))*1.3;
    C=mix(vec3(.55,.75,1.3),vec3(1.2,.45,.75),h.z)*(.5+.5*r2.x);
    S=.024; A=.5;
  }else if(kind<.62){
    float side=r2.z<.5?1.:-1.;
    float u=r3.x;
    float a=side*1.7*u+(side>0.?.4:PI+.4)+uTime*.03;
    float r=1.1+1.7*u;
    P=(vec3(r*cos(a),r*sin(a),.3*side*u)+g*(.07+.24*u))*1.3;
    C=vec3(.65,.6,1.)*(.7*(1.-u)+.2);
    S=.02; A=.45;
  }else{
    float r=1.7*sqrt(r3.y);
    float a=s.y*TAU+uTime*.1/(r+.3);
    P=vec3(r*cos(a),r*sin(a),g.z*.28);
    P+=flow(P*1.6,uTime*.08)*.2;
    P*=1.3;
    C=mix(vec3(1.,.35,.45),vec3(.5,.55,1.),r3.x)*.6;
    S=.03; A=.4;
  }
  P.yz=rot(1.0)*P.yz;
}

void milkyWay(out vec3 P,out vec3 C,out float S,out float A){
  // a barred spiral like ours, grown from a gas cloud. gq is how far it has formed (0 cloud, 1 finished):
  // the cloud starts compact, puffy and pink; as it forms, the disc spreads and flattens, inner parts
  // spin ahead of outer ones (which winds the arms), and the arms condense out of the haze
  float kind=r3.z;
  float q=gq, nq=1.-q;
  float pat=uTime*.025;
  float barA=.5+pat;
  float K=3.3;     // log-spiral winding, a pitch of about 17 degrees
  float R0=.55;    // the arms start at the ends of the bar
  float REDGE=2.85;
  float spread=mix(.32,1.,pow(q,.7));          // the young disc is compact
  float puff=mix(10.,1.,q);                    // and thick
  float scatter=nq*nq;                         // and has no arms yet
  S=.02; A=.5;
  if(kind<.17){
    // bulge and bar: dense, bright, old and warm; a big glowing cloud before it settles
    vec3 q3=g*vec3(.46,.17,.15);
    q3.xy=rot(barA)*q3.xy;
    vec3 bul=g*.2;
    P=mix(bul,q3,step(.45,r2.x))*mix(2.2,1.,q);
    C=mix(vec3(1.,.72,.42),vec3(1.,.9,.74),r2.x)*1.05; A=.6;
  }else if(kind<.39){
    // the old disc: smooth and dim, densest in the middle, with dark lanes along the inner edges of the main arms
    float r=min(REDGE,.12-.62*log(1.-.96*r2.x));
    float th=s.y*TAU+pat;
    P=vec3(r*cos(th),r*sin(th),g.z*.035*puff);
    C=vec3(1.,.86,.66)*mix(.6,.35,smoothstep(.5,2.6,r));
    float ph=mod(th-barA-K*log(max(r,R0)/R0),PI);
    float lane=smoothstep(.02,.1,ph)*(1.-smoothstep(.28,.42,ph))*smoothstep(R0,R0+.2,r)*q;
    A=.45*(1.-.85*lane);
    P.xy*=spread;
  }else{
    // spiral arms: two major off the bar ends, two minor between; thick and bright near the centre,
    // thinning and fading towards the edge; yellower inside, bluer outside
    float pick=r2.y;
    float a0=pick<.35?0.:pick<.70?PI:pick<.85?PI*.5:PI*1.5;
    float major=step(pick,.70);
    float rs=mix(.95,R0,major);
    float knot=step(r3.x,.1);
    float tr=pow(s.x,1.35);
    if(knot>.5)tr=pow(hash13(vec3(floor(s.x*30.),a0,2.)),1.2);
    float r=rs+(REDGE-rs)*tr;
    float edge=smoothstep(rs,REDGE,r);         // 0 at the arm's root, 1 at the rim
    float th=a0+barA+K*log(r/R0);
    float cloud=(1.-knot)*step(hash13(s*7.3+w),.36);
    float width=mix(.34,.07,edge)*mix(1.,1.9,cloud)*mix(1.,.45,major<.5?0.:0.)*mix(1.,.4,knot);
    if(major<.5)width*=.7;
    th-=abs(g.x)*width/r;
    th+=cloud*g.y*.05/r;
    // formation: no arm structure at first, then differential spin winds the arms into place
    th+=scatter*(r3.y-.5)*TAU*.9+nq*nq*3.5/(r*spread+.25);
    float rr=r+g.y*mix(.05,.14,cloud)*mix(1.4,.6,edge);
    P=vec3(rr*cos(th),rr*sin(th),g.z*mix(.03,.065,cloud)*mix(1.6,.7,edge)*puff);
    P.xy*=spread;
    vec3 young=mix(vec3(.55,.7,1.15),vec3(.85,.9,1.),r2.x);
    vec3 older=vec3(1.,.86,.66);
    float fade=mix(1.15,.42,edge);
    C=mix(older,young,smoothstep(.15,.7,edge))*(.55+.5*r3.y)*mix(.72,1.,major)*fade;
    if(cloud>.5){C=mix(vec3(.45,.55,1.),vec3(.9,.45,.75),r3.y)*mix(.45,.6,major)*fade;S=.055;A=.16;}
    if(knot>.5){C=vec3(1.25,.38,.6)*mix(1.,.7,edge);S=.018;A=.6*q;}
  }
  // the forming galaxy glows pink with gas
  C=mix(vec3(1.,.48,.6)*.55*(.6+.6*r3.y),C,smoothstep(0.,.75,q));
  P.yz=rot(1.05)*P.yz;
}

void heart(out vec3 P,out vec3 C,out float S,out float A){
  // a supermassive black hole: its ring of light, its disc, and stars whipping round it
  float kind=r3.z;
  float a=s.y*TAU;
  if(kind<.16){
    float r=.62+abs(g.x)*.025;
    float a2=a+uTime*.6;
    P=vec3(r*cos(a2),r*sin(a2),0.);
    C=vec3(1.,.84,.55)*(.5+.5*cos(a2-2.6));
    S=.016; A=.8;
  }else if(kind<.34){
    float r=.66+.32*s.x*s.x;
    float a2=a+uTime*.3;
    P=vec3(r*cos(a2),r*sin(a2),0.);
    C=vec3(1.,.5,.18)*(.3+.3*cos(a2-2.6))*(1.-smoothstep(.66,.98,r));
    S=.022; A=.5;
  }else if(kind<.94){
    float r=.95+1.9*pow(s.x,1.6);
    float th=a+uTime*1.6/pow(r,1.5);
    P=vec3(r*cos(th),r*sin(th),g.z*.02*r);
    P.yz=rot(1.3)*P.yz;
    C=mix(vec3(1.,.9,.7),vec3(.9,.22,.07),smoothstep(.95,2.4,r));
    C*=(.3+.7*(.5-.5*cos(th)))*(.7+.3*sin(r*18.+r2.x));
    S=.02; A=.55;
  }else{
    float id=floor(s.x*14.);
    vec3 h=hash33(vec3(id,4.,8.));
    float sa=1.2+2.2*h.x, e=.3+.5*h.y;
    float M=h.z*TAU+uTime*2.2/pow(sa,1.5);
    float r=sa*(1.-e*e)/(1.+e*cos(M));
    float om=hash13(vec3(id,9.,1.))*TAU;
    P=vec3(r*cos(M+om),r*sin(M+om),0.);
    P.yz=rot(hash13(vec3(id,5.,6.))*PI)*P.yz;
    P+=g*.006;
    C=mix(vec3(.6,.75,1.),vec3(1.,.8,.55),h.y)*.8; S=.016; A=.45;
  }
}

// the pillars of the stellar nursery: base, tip and half-width (a scene like the Pillars of Creation)
const vec2 PB[3]=vec2[3](vec2(-1.55,-1.75),vec2(-.25,-1.75),vec2(1.,-1.75));
const vec2 PT[3]=vec2[3](vec2(-1.15,.7),vec2(-.05,.25),vec2(.6,-.2));
const float PWD[3]=float[3](.52,.43,.36);
// how far a point is from the nearest pillar's axis, in pillar half-widths (below 1 is inside)
float pillarDist(vec2 p){
  float best=9.;
  for(int i=0;i<3;i++){
    vec2 ab=PT[i]-PB[i];
    float t=clamp(dot(p-PB[i],ab)/dot(ab,ab),0.,1.);
    float wd=PWD[i]*(1.-.5*t);
    best=min(best,length(p-(PB[i]+ab*t))/wd);
  }
  return best;
}

void nursery(out vec3 P,out vec3 C,out float S,out float A){
  // pillars of cold gas and dust rising into a glowing cloud. Hot young stars above erode them:
  // their edges glow gold, the gas shines red (hydrogen) turning green-teal (oxygen) near the stars,
  // and dense knots at the tips are where new stars begin
  float kind=r3.z;
  if(kind<.08){
    // knots at the pillar tips; the first is the one the camera dives into
    float id=floor(r2.x*5.);
    vec2 kc=id<1.?PT[2]:id<2.?PT[0]:id<3.?PT[1]:mix(PB[1],PT[1],.55+.3*hash13(vec3(id,2.,2.)));
    P=vec3(kc,0.)+g*(.04+.1*r3.x*r3.x);
    C=vec3(1.,.45,.22)*(.35+.4*r3.y); S=.022; A=.3;
  }else if(kind<.40){
    // the pillars: dark dusty interiors, edges and tips lit gold by the stars above
    int i=r2.z<.45?0:r2.z<.78?1:2;
    float t=pow(r3.x,.75);
    vec2 ab=PT[i]-PB[i];
    vec2 n=normalize(vec2(-ab.y,ab.x));
    float wd=PWD[i]*(1.-.5*t);
    float u=clamp(g.x*.45,-1.1,1.1);
    vec2 c=PB[i]+ab*t+n*u*wd;
    P=vec3(c,g.z*wd*.55);
    P.xy+=flow(P*3.+float(i),uTime*.02).xy*.03*wd*4.;
    float edge=smoothstep(.35,.9,abs(u))*(.55+.45*t);
    float tip=smoothstep(.85,1.,t)*.7;
    float lit=max(edge,tip);
    C=mix(vec3(.55,.3,.17)*.45,vec3(1.05,.72,.4),lit)+vec3(.06,.22,.1)*tip;
    S=.032; A=mix(.3,.5,lit);
  }else if(kind<.41){
    // the young, hot stars above the pillars
    P=vec3(.4,1.35,-.4)+g*vec3(1.3,.25,.4);
    C=vec3(.75,.85,1.1); S=r3.y<.2?.05:.03; A=.6;
  }else if(kind<.43){
    // stars scattered through the field
    float id=floor(r2.x*60.);
    P=(hash33(vec3(id,8.,2.))*2.-1.)*vec3(2.8,1.7,.9)+g*.004;
    C=vec3(.85,.88,1.); S=.016; A=.45;
  }else{
    // the glowing cloud: red hydrogen, green-teal oxygen near the stars, gold along the pillar edges;
    // nothing glows from behind a pillar, so the pillars stand out dark against it
    P=(s*2.-1.)*vec3(2.9,1.75,1.1);
    P+=flow(P*1.3,uTime*.03)*.34;
    P+=flow(P*2.9+7.,uTime*.05)*.14;
    float n=sin(P.x*2.1+sin(P.y*3.)*1.3)+sin(P.y*1.7+P.z*2.);
    float lit=smoothstep(-.5,.8,n);
    float hy=(P.y+1.75)/3.5;
    float ox=smoothstep(.45,1.,hy+.3*sin(P.x*1.1+P.z*2.3)+.25*(r2.x-.5));
    C=mix(vec3(1.3,.14,.2),vec3(.2,1.,.55),ox);
    C=mix(C,vec3(.8,.06,.1),smoothstep(.6,1.,sin(P.x*3.7+P.y*2.9)*.5+.5)*.35*(1.-ox));
    float d=pillarDist(P.xy);
    float rim=exp(-pow((d-1.)*3.,2.));
    C=mix(C,vec3(1.2,.8,.4),rim*.5)*(.1+.85*lit)*(1.+1.2*rim);
    S=.05; A=.3;
    if(P.z<.6)A*=1.-.92*(1.-smoothstep(.75,1.15,d));
  }
}

void protostar(out vec3 P,out vec3 C,out float S,out float A){
  // a newborn star still buried in its cloud, like those Webb images: gas spirals in along streamers,
  // spinning faster as it falls, and flattens into a disc; twin jets with glowing knots end in bow shocks;
  // hourglass cavities carved by the outflow glow faintly in scattered starlight
  float kind=r3.z;
  if(kind<.05){
    P=g*.06; C=vec3(1.,.6,.32)*1.1; S=.03; A=.8;
  }else if(kind<.25){
    // the young disc
    float r=.12+.7*sqrt(s.x);
    float th=s.y*TAU+uTime*.6/(pow(r,1.5)+.1);
    P=vec3(r*cos(th),r*sin(th),g.z*.04*(.3+r));
    C=mix(vec3(1.,.62,.3),vec3(.6,.22,.1),r); S=.02; A=.5;
  }else if(kind<.62){
    // infall along streamers: each spins up as it falls (angular momentum) and settles towards the disc
    float id=floor(r2.x*9.);
    float ph=fract(s.x+uTime*.025);
    float r=mix(2.4,.3,ph*ph);
    float th=hash13(vec3(id,3.,7.))*TAU+1.3/sqrt(r)-1.3/sqrt(2.4)+uTime*.05;
    float hgt=(hash13(vec3(id,1.,9.))-.5)*2.;
    P=vec3(r*cos(th),r*sin(th),hgt*r*.55*(1.-ph*.7));
    P+=flow(P*1.7+id,uTime*.04)*.12*r;                       // streamers wander, not straight spokes
    P+=g*(.03+.07*r)*(.5+hash13(vec3(id,5.,5.)));
    C=vec3(.75,.3,.15)*(.3+.7*ph)*smoothstep(0.,.12,ph)*(1.-smoothstep(.92,1.,ph))*(.6+.6*hash13(vec3(id,8.,1.)));
    S=.03; A=.3;
  }else if(kind<.74){
    // the hourglass cavities the outflow has carved, lit faintly blue by scattered starlight
    float side=r2.z<.5?1.:-1.;
    float u=pow(s.x,.8);
    float cr=(.12+.75*pow(u,.65))*(1.+g.x*.08);
    float a=s.y*TAU;
    P=vec3(cr*cos(a),cr*sin(a),side*(.08+2.1*u));
    C=vec3(.45,.6,1.)*(.25+.35*(1.-u)); S=.026; A=.3;
  }else if(kind<.80){
    // what is left of the surrounding cloud
    vec3 d2=normalize(hash33(s*17.3+w*5.1)-.5+vec3(1e-4));
    P=d2*(1.+1.6*sqrt(r3.x)); C=vec3(.4,.15,.1)*.25; S=.04; A=.25;
  }else{
    float side=r3.y<.5?1.:-1.;
    if(r2.x<.25){
      // a bow shock where the jet slams into the cloud
      float a=s.y*TAU, rr=.28*sqrt(s.x);
      P=vec3(rr*cos(a),rr*sin(a),side*(2.35-1.6*rr*rr))+g*.02;
      C=mix(vec3(1.2,.3,.25),vec3(1.1,.6,.3),s.x); S=.022; A=.45;
    }else{
      // the jet itself, studded with glowing knots
      float h=fract(r2.z+uTime*.08);
      float wj=.01+.03*h;
      P=vec3(g.x*wj,g.y*wj,side*(.1+2.2*h));
      float knot=pow(.5+.5*sin(h*26.-uTime*1.2),6.);
      C=mix(vec3(.55,.75,1.)*.5,vec3(1.25,.28,.22),knot)*(.35+.9*knot);
      S=.018; A=.6;
    }
  }
  P.yz=rot(1.12)*P.yz;
}

void youngStar(out vec3 P,out vec3 C,out float S,out float A){
  // the star ignites; its dusty disc shows rings and gaps
  float rr=.12+2.3*sqrt(s.x);
  rr+=.07*sin(rr*11.);
  float th=s.y*TAU+uTime*.35/(pow(rr,1.5)+.15);
  P=vec3(rr*cos(th),rr*sin(th),(s.z-.5)*.05*(1.+rr*1.5));
  float core=step(r2.y,.09);
  P=mix(P,g*.13,core);
  C=mix(vec3(1.,.74,.3),vec3(.85,.4,.18),smoothstep(.3,1.6,rr));
  C=mix(C,mix(vec3(.3,.7,.45),vec3(.8,.2,.12),r3.x),smoothstep(1.2,2.4,rr)*r3.z);
  C=mix(C,vec3(1.,.93,.75),core);
  S=mix(.02,.035,core); A=mix(.5,.85,core);
  P.yz=rot(1.12)*P.yz;
}

void worlds(out vec3 P,out vec3 C,out float S,out float A){
  // planets grow out of the dust disc. wq is how far they have formed (0 dust rings, 1 finished):
  // dust drifts along each ring and gathers on a growing clump, the lanes thin to faint lines,
  // the star at the centre settles and brightens
  float q=wq;
  int ip=int(min(floor(s.x*8.),7.));
  float pr=PR[ip];
  float hp=hash13(vec3(float(ip),7.,3.));
  float om=.18/(pow(pr,1.5)+.05);
  float a=s.y*TAU+uTime*om;
  float ph=hp*TAU+uTime*om;                 // where this ring's planet is
  float dw=.09+.05*pr;                      // the dust ring's width
  vec3 dustC=mix(vec3(1.,.74,.3),vec3(.85,.4,.18),smoothstep(.3,1.6,pr))*mix(1.05,.6,q);
  float kind=r2.x;
  S=.014; A=.6;
  if(kind<.42){
    // material that becomes the planet: arrivals are staggered, so the clump grows over time
    float arrive=smoothstep(r3.x*.75,r3.x*.75+.25,q);
    float da=mod(a-ph+PI,TAU)-PI;
    float ang=ph+da*(1.-arrive);
    float rad=pr+g.x*dw*(1.-arrive);
    P=vec3(rad*cos(ang),rad*sin(ang),g.z*.03*(1.-arrive))+g*PS[ip]*arrive;
    C=mix(dustC,PC[ip]*(.6+.5*r3.x),arrive);
    S=mix(.016,.018,arrive);
    A=mix(.5,max(.012,.05*pow(PS[ip]/.05,2.)),pow(arrive,.6));
  }else if(kind<.56){
    // the ring's lane: a band of dust that thins to a faint orbit line
    float rad=pr+g.x*dw*(1.-q)+g.x*.004*q;
    P=vec3(rad*cos(a),rad*sin(a),g.z*.03*(1.-q));
    C=mix(dustC,vec3(.5,.5,.58)*.16,q);
    A=mix(.5,.6,q);
  }else if(kind<.65){
    // the asteroid belt: leftovers between the rocky worlds and the giants
    float r=.94+g.x*mix(.14,.07,q);
    P=vec3(r*cos(a),r*sin(a),g.z*.02); C=mix(dustC,vec3(.6,.5,.4)*.4,q); S=.012;
  }else if(kind<.80){
    // the outer belt of icy leftovers
    float r=2.8+g.x*mix(.25,.14,q);
    P=vec3(r*cos(a),r*sin(a),g.z*.05); C=mix(dustC*.7,vec3(.5,.6,.75)*.3,q); S=.012;
  }else{
    // the last of the diffuse dust, fading as the system clears
    float r=.2+2.7*sqrt(r3.y);
    P=vec3(r*cos(a),r*sin(a),g.z*.03*(2.-q)); C=dustC*mix(.5,.12,q);
  }
  float core=step(r2.y,.07);
  P=mix(P,g*mix(.13,.09,q),core);
  C=mix(C,vec3(1.,.95,.8)*mix(.85,1.,q),core);
  S=mix(S,.035,core); A=mix(A,.85,core);
  P.yz=rot(1.12)*P.yz;
}

void redGiant(out vec3 P,out vec3 C,out float S,out float A){
  // a red giant, modelled on direct images like that of pi1 Gruis: a surface of a few enormous boiling
  // convection cells, darker and redder towards the edge; shells of shed gas drift outward, faint and dusty
  if(r2.y<.5){
    vec3 d=normalize(hash33(s*17.3+w*5.1)-.5+vec3(1e-4));
    d.z=abs(d.z);                         // only the face towards us; the far side is hidden behind the star
    float R=1.3*(1.+.03*sin(uTime*.5));
    P=d*R*(1.+.012*g.x);
    vec3 q=d; q.xz=rot(uTime*.02)*q.xz;
    float t=uTime*.07;
    float cells=sin(3.2*q.x+1.6*sin(2.2*q.y+t))*sin(3.0*q.y+1.8*sin(2.5*q.z-t))*sin(2.8*q.z+1.5*sin(2.*q.x+t*.7));
    cells=.5+.5*cells+.12*sin(9.*q.x+7.*q.y-t*2.)*sin(8.*q.z-6.*q.x+t);
    float mu=d.z;
    C=mix(vec3(.75,.12,.04),vec3(1.25,.6,.22),pow(mu,.6))*(.4+.8*smoothstep(.15,.9,cells))*mix(.35,1.,mu);
    S=.034; A=.6*max(mu,.12);            // even coverage across the disc, then darker towards the edge
  }else{
    float sh=floor(r3.x*5.);
    float ph=fract(sh/5.+uTime*.012);
    float Rs=1.45+1.8*ph;
    vec3 d=normalize(g+vec3(1e-4));
    float patchy=smoothstep(.1,.7,.5+.5*sin(d.x*5.+sh)*sin(d.y*4.+d.z*3.+sh*2.));
    P=d*(Rs+g.x*.02);
    C=mix(vec3(1.,.5,.22),vec3(.4,.5,.8),ph)*(1.-ph)*.9*patchy;
    S=.024; A=.4;
    if(P.z<0.&&length(P.xy)<1.3)A=0.;   // shells behind the star are hidden
  }
}

void nebulaEye(out vec3 P,out vec3 C,out float S,out float A){
  // a dying star's shed shell, read as an eye
  float a=s.y*TAU;
  float kind=r3.z;
  float Nf=220.;
  float fi=floor(s.y*Nf);
  float fr=hash13(vec3(fi,1.,2.));
  float lump=.13*sin(a*2.+.6)+.08*sin(a*5.+2.)+.05*sin(a*9.+uTime*.05);
  float r; S=.03; A=.42;
  if(kind<.02){
    P=g*.02; C=vec3(.85,.95,1.); S=.034; A=.9;
  }else if(kind<.14){
    r=.72*sqrt(s.x);
    P=vec3(r*cos(a),r*sin(a),g.z*.1);
    C=vec3(.04,.16,.42)*(.35+.5*r2.x);
  }else if(kind<.50){
    float r0=.66+.2*fr;
    r=r0+.75*pow(s.x,1.8);
    float ak=(fi+.5)/Nf*TAU+(r3.x-.5)*(.012+.05*(r-r0));
    P=vec3(r*cos(ak),r*sin(ak),g.z*.06);
    C=mix(vec3(.2,1.,.7),vec3(.1,.45,.9),smoothstep(0.,.7,r-r0))*(.45+.8*fr);
    S=.022; A=.5;
  }else if(kind<.90){
    r=1.55+lump+g.x*.3;
    P=vec3(r*cos(a),r*sin(a),g.z*.12);
    C=mix(vec3(1.,.55,.14),vec3(1.05,.1,.1),smoothstep(1.4,2.05,r));
    C=mix(vec3(.3,.95,.35),C,smoothstep(1.,1.5,r));
    C*=.55+.6*r2.x;
  }else{
    r=2.+lump+1.3*pow(s.x,1.5);
    P=vec3(r*cos(a),r*sin(a),g.z*.2);
    C=vec3(.85,.07,.09)*(1.-smoothstep(2.4,3.4,r))*.8;
  }
  P+=flow(P*2.2+fr,uTime*.15)*.035;
  P.x*=1.2;
  P.xy=rot(-.18)*P.xy;
}

void shape(int k,out vec3 P,out vec3 C,out float S,out float A){
  if(k==0)energy(P,C,S,A);
  else if(k==1)web(P,C,S,A);
  else if(k==2)protocluster(P,C,S,A);
  else if(k==3)youngGalaxy(P,C,S,A);
  else if(k==4)milkyWay(P,C,S,A);
  else if(k==5)heart(P,C,S,A);
  else if(k==6)nursery(P,C,S,A);
  else if(k==7)protostar(P,C,S,A);
  else if(k==8)youngStar(P,C,S,A);
  else if(k==9)worlds(P,C,S,A);
  else if(k==10)redGiant(P,C,S,A);
  else nebulaEye(P,C,S,A);
}

// where each zoom-in aims, in the coordinates of the scene being left
vec3 focus(int k){
  if(k==1){vec3 f=nodePos(vec3(0.));f.xz=rot(uTime*.04)*f.xz;return f;}
  if(k==2)return FC;
  if(k==6)return vec3(PT[2],0.);   // the knot at the tip of the smallest pillar
  return vec3(0.);
}

void main(){
  s=aSeed.xyz; w=aSeed.w;
  r2=hash33(s*91.7+w*13.1);
  r3=hash33(s.zxy*57.3+w*7.7);
  g=(r2+r3+hash33(s.yzx*33.1+w)-1.5)*1.15;

  float kf=min(floor(uT),__LAST__.);
  int k=int(kf);
  float z=clamp(uT-kf,0.,1.);
  float zs=z*z*(3.-2.*z);
  vec3 P,C; float S,A;
  float hw=0.,hr=.6; vec3 hc=vec3(0.);

  if(uZoom!=0.){
    // a true zoom: pass 0 draws the scene we leave, pass 1 the scene we arrive at
    float L=abs(uZoom);
    bool first=uPass<.5;
    shape(first?k:k+1,P,C,S,A);
    if(uZoom>0.){
      // fly towards the focus: the old scene streams past, the new one grows out of that point
      vec3 foc=focus(k);
      vec3 aim=foc*smoothstep(0.,.45,zs);
      float grow=exp(L*zs);
      if(first){P=(P-aim)*grow;A*=1.-smoothstep(.45,.9,zs);}
      else{P=(foc-aim)*grow+P*exp(L*(zs-1.));A*=smoothstep(.06,.5,zs);}
      if(k==HEART-1){hc=(foc-aim)*grow;hr=.6*exp(L*(zs-1.));hw=smoothstep(.06,.5,zs);}
    }else{
      // pull back: the old scene shrinks away, the new one arrives from beyond the camera
      vec3 off=vec3(-2.4,1.2,0.)*zs;
      if(first){P=P*exp(-L*zs)+off;A*=1.-smoothstep(.5,.95,zs);}
      else{P=P*exp(L*(1.-zs));A*=smoothstep(.05,.5,zs);}
      if(k==HEART){hc=off;hr=.6*exp(-L*zs);hw=1.-smoothstep(.5,.95,zs);}
    }
  }else{
    // a morph: each particle travels from its place in one shape to its place in the next
    vec3 Pa,Pb,Ca,Cb; float Sa,Sb,Aa,Ab;
    float f=ease(z*1.5-.5*w);
    float swirl=1.;
    if(k==3){
      // the young galaxy collapses into a central cloud, then the spiral grows out of it
      gq=smoothstep(.22,1.,z);
      f=ease(z*2.6-.7*w);
      swirl=.35;
    }
    if(k==8){
      // the star's disc settles into dust rings, then planets gather out of them
      wq=smoothstep(.18,1.,z);
      f=ease(z*3.-.6*w);
      swirl=.25;
    }
    shape(k,Pa,Ca,Sa,Aa);
    shape(k+1,Pb,Cb,Sb,Ab);
    gq=1.;wq=1.;
    if(k==GIANT)Pa*=exp(-1.8*zs);   // the giant shrinks to a white dwarf while its shells keep expanding
    P=mix(Pa,Pb,f); C=mix(Ca,Cb,f); S=mix(Sa,Sb,f); A=mix(Aa,Ab,f);
    float sw=sin(PI*f)*swirl;
    P+=flow(P*.9+w*3.,uTime*.5)*.16*sw;
    P.xy=rot(sw*(w-.35)*.9)*P.xy;
    C+=vec3(.25,.12,.3)*sw*r2.x;
    if(k==HEART)hw=1.-f;
  }

  float dist=uCam-P.z;
  float fo=2.1445;
  if(dist<.06||A<=0.){gl_Position=vec4(2.,2.,2.,1.);gl_PointSize=1.;vCol=vec3(0.);vA=0.;return;}
  gl_Position=vec4(P.x*fo/uAspect,P.y*fo+uShift*dist,0.,dist);
  float ps=S*uPx*fo*.5/dist;
  float ref=uPx*.012;
  vA=A*uAlpha*min(1.,pow(ref/ps,1.3));
  // the black hole's shadow hides anything behind it
  if(hw>0.&&P.z<hc.z-.005){
    float dh=uCam-hc.z;
    float sd=length(P.xy/dist-hc.xy/dh)*dh;
    vA*=1.-hw*(1.-smoothstep(hr*.93,hr,sd));
  }
  gl_PointSize=clamp(ps,1.,uPx*.07);
  vCol=C;
}`;

var FS=`#version 300 es
precision mediump float;
in vec3 vCol;
in float vA;
out vec4 o;
void main(){
  vec2 d=gl_PointCoord-.5;
  float r=dot(d,d)*4.;
  float gl=exp(-r*3.5)*(1.-smoothstep(.8,1.,r));
  o=vec4(vCol*vA*gl,1.);
}`;

var canvas=document.getElementById("c");
var gl=canvas.getContext("webgl2",{antialias:false,alpha:false,powerPreference:"high-performance"});
if(!gl){document.getElementById("fail").style.display="flex";return;}

function sh(type,src){
  var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));throw new Error("shader");}
  return s;
}
var prog=gl.createProgram();
// the shader draws SHAPE_COUNT shapes; the Atlas must have one event per shape (tests check this)
var SHAPE_COUNT=12, LAST=SHAPE_COUNT-1;
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS.replace("__LAST__",String(LAST-1))));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(prog));document.getElementById("fail").style.display="flex";return;}
gl.useProgram(prog);
var U={};["uT","uTime","uAspect","uPx","uCam","uAlpha","uField","uShift","uPass","uZoom"].forEach(function(n){U[n]=gl.getUniformLocation(prog,n);});

var COUNTS=[60000,120000,240000];
var coarse=window.matchMedia&&window.matchMedia("(pointer:coarse)").matches;
var qi=coarse?0:1;
var N=0, buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,4,gl.FLOAT,false,0,0);
var qBtn=document.getElementById("q");
function setCount(i){
  qi=i;N=COUNTS[qi];
  var a=new Float32Array(N*4);
  // deterministic seeds so every device and every captured frame shows the same universe
  var x=123456789;
  for(var k=0;k<a.length;k++){x^=x<<13;x^=x>>>17;x^=x<<5;a[k]=(x>>>0)/4294967296;}
  gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);
  qBtn.textContent=(N/1000)+"k";
}
setCount(qi);
qBtn.addEventListener("click",function(){setCount((qi+1)%COUNTS.length);});

gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE,gl.ONE);
gl.clearColor(.012,.012,.03,1);

var W=0,H=0,aspect=1;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);
  if(w!==W||h!==H){W=w;H=h;canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);aspect=w/h;}
}
window.addEventListener("resize",resize);resize();

var TAN=0.4663; // tan(25 deg)
var CAMS=[], TRANS=[], PACE=[], shift=0; // filled from each event's camera cue
for(var c=0;c<SHAPE_COUNT;c++)CAMS.push({dist:5.6,fitW:2.6,fitH:1.8});
var hudEl=document.querySelector('.hud');
var liftTarget=0; // how far the scene sits above the text panel; changes only on resize, never with the text
function liftFromHud(){liftTarget=Math.min(.45,Math.max(0,(hudEl.offsetHeight-44)/Math.max(1,canvas.clientHeight)));}
function reserveText(){
  if(!EVENTS.length){liftFromHud();return;}
  var m=read.cloneNode(true);m.removeAttribute("id");m.className="read in measure";
  m.querySelectorAll("[id]").forEach(function(el){el.removeAttribute("id");});
  read.parentNode.style.position="relative";read.parentNode.appendChild(m);
  var tallest=0,parts=m.children;
  EVENTS.forEach(function(e){
    m.querySelector("h1").textContent=e.title;
    m.querySelector(".chip").textContent=LABELS[e.label];
    var spans=m.querySelectorAll(".meta span");spans[0].textContent=e.era;spans[2].textContent=e.scale;
    m.querySelector(".note").textContent=e.note;
    m.querySelector(".src").textContent="Sources: "+e.sources.map(function(id){return SOURCES[id]?SOURCES[id].publisher:"";}).join(" · ");
    tallest=Math.max(tallest,m.offsetHeight);
  });
  m.remove();
  read.style.minHeight=Math.ceil(tallest)+"px";
  liftFromHud();
}
liftFromHud();
var reserveTimer=0;
window.addEventListener("resize",function(){clearTimeout(reserveTimer);reserveTimer=setTimeout(reserveText,150);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){reserveText();});
function cam(t){
  var i=Math.min(LAST-1,Math.floor(t)),f=t-i;f=f*f*(3-2*f);
  function d(k){var q=CAMS[k];return Math.max(q.dist,q.fitW/(TAN*aspect),q.fitH/(TAN*(1-shift)));}
  return d(i)+(d(i+1)-d(i))*f;
}

var slider=document.getElementById("t"),playBtn=document.getElementById("play"),read=document.getElementById("read");
var T=0,playing=false,swapTimer=0;
var textStage=-2,hiddenAt=0;   // which stage's text is on screen; -1 none, -2 the placeholder
var phase="moving",hold=0;      // while playing: moving between stages, holding on one, or letting its text leave
var TEXT_OUT=1600;               // ms for the text to leave
var EVENTS=[],SOURCES={};
var LABELS={observed:"Observed",model:"Model-dependent",art:"Artistic interpretation"};
// split the title into letters (kept whole per word so lines still wrap) and the note into words
function letters(el,text){
  el.textContent="";el.setAttribute("aria-label",text);
  var i=0,words=text.split(" ");
  words.forEach(function(wd,wi){
    var ws=document.createElement("span");ws.className="w";ws.setAttribute("aria-hidden","true");
    Array.from(wd).forEach(function(ch){
      var c=document.createElement("span");c.className="c";c.textContent=ch;
      var a=Math.random()*Math.PI*2,d=.25+Math.random()*.55;
      c.style.setProperty("--i",i+Math.random()*3);
      c.style.setProperty("--r",Math.random());
      c.style.setProperty("--dx",(Math.cos(a)*d).toFixed(2)+"em");
      c.style.setProperty("--dy",(Math.sin(a)*d).toFixed(2)+"em");
      ws.appendChild(c);i++;
    });
    el.appendChild(ws);
    if(wi<words.length-1)el.appendChild(document.createTextNode(" "));
  });
}
function words(el,text){
  el.textContent="";
  text.split(" ").forEach(function(wd,i,all){
    var n=document.createElement("span");n.className="nw";n.textContent=wd;n.style.setProperty("--i",i);
    el.appendChild(n);
    if(i<all.length-1)el.appendChild(document.createTextNode(" "));
  });
}
function hideText(){
  if(textStage===-1)return;
  textStage=-1;hiddenAt=performance.now();clearTimeout(swapTimer);
  read.classList.remove("in");read.classList.add("out");
}
function showText(i){
  if(i===textStage||!EVENTS[i])return;
  var wait=0;
  if(textStage!==-1){hideText();wait=TEXT_OUT;}
  else wait=Math.max(0,TEXT_OUT-(performance.now()-hiddenAt));
  textStage=i;
  clearTimeout(swapTimer);
  swapTimer=setTimeout(function(){
    var e=EVENTS[i];
    var title=document.getElementById("title");
    letters(title,e.title);
    // pace the sequence to this title and note
    var n=e.title.length,nw=e.note.split(" ").length;
    var metaAt=1.2+n*.07*.6, chipAt=metaAt+.5, noteAt=metaAt+1.1, srcAt=noteAt+nw*.075+1.2;
    read.style.setProperty("--meta-at",metaAt.toFixed(2)+"s");
    read.style.setProperty("--chip-at",chipAt.toFixed(2)+"s");
    read.style.setProperty("--note-at",noteAt.toFixed(2)+"s");
    read.style.setProperty("--src-at",srcAt.toFixed(2)+"s");
    var chip=document.getElementById("chip");chip.textContent=LABELS[e.label];chip.className="chip "+e.label;
    document.getElementById("era").textContent=e.era;
    document.getElementById("scale").textContent=e.scale;
    words(document.getElementById("note"),e.note);
    var src=document.getElementById("src");src.textContent="";
    e.sources.forEach(function(id,k){
      var so=SOURCES[id];if(!so)return;
      src.appendChild(document.createTextNode(k?" · ":"Sources: "));
      var a=document.createElement("a");a.href=so.url;a.target="_blank";a.rel="noopener";
      a.textContent=so.publisher;a.title=so.title;src.appendChild(a);
    });
    read.classList.remove("out");
    void read.offsetWidth;
    requestAnimationFrame(function(){requestAnimationFrame(function(){read.classList.add("in");});});
  },wait);
}
letters(document.getElementById("title"),document.getElementById("title").textContent);
words(document.getElementById("note"),document.getElementById("note").textContent);
// how long Play rests on a stage: time for the text to arrive, then time to read it
function dwell(i){
  var e=EVENTS[i];if(!e)return 4;
  return 5+e.note.split(" ").length*.28;
}
// keep the screen awake while the journey plays (Screen Wake Lock; quietly does nothing where unsupported)
var wakeLock=null;
function holdScreen(){
  if(wakeLock||!("wakeLock" in navigator))return;
  navigator.wakeLock.request("screen").then(function(l){
    wakeLock=l;l.addEventListener("release",function(){wakeLock=null;});
    if(!playing)releaseScreen();
  }).catch(function(){});
}
function releaseScreen(){if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null;}}
// the browser drops the lock when the tab is hidden; take it back on return
document.addEventListener("visibilitychange",function(){if(!document.hidden&&playing)holdScreen();});
function stop(){playing=false;phase="moving";playBtn.textContent="Play";releaseScreen();}
function setT(v,fromSlider){
  T=Math.max(0,Math.min(LAST,v));
  if(!fromSlider)slider.value=T;
}
var glideTo=null;
slider.addEventListener("input",function(){stop();wakeSound();glideTo=null;setT(parseFloat(slider.value),true);});
// letting go close to a stage settles on it
slider.addEventListener("change",function(){var r=Math.round(T);if(Math.abs(T-r)<.1)glideTo=r;});
function toggle(){
  if(playing){stop();return;}
  wakeSound();
  if(T>=LAST-.001)setT(0);
  playing=true;playBtn.textContent="Pause";holdScreen();
  var r=Math.round(T);
  if(Math.abs(T-r)<.015){
    setT(r);phase="holding";
    // its text is already up: a short rest before moving on
    hold=textStage===r?2:dwell(r);
  }else phase="moving";
}
playBtn.addEventListener("click",toggle);
// sound starts on a tap, since browsers only allow audio after one
var sndBtn=document.getElementById("snd"),AC=null,SND=null,soundOn=false,ended=false;
// after the journey ends the sound fades away; any interaction brings it back
function wakeSound(){if(ended){ended=false;if(SND&&soundOn)SND.setOn(true,3);}}
sndBtn.addEventListener("click",function(){
  try{
    if(!AC){var Ctx=window.AudioContext||window.webkitAudioContext;try{AC=new Ctx({latencyHint:"playback"});}catch(e){AC=new Ctx();}SND=createSoundtrack(AC,AC.destination);SND.prime();}
    soundOn=!soundOn;ended=false;
    if(soundOn)AC.resume();
    SND.setOn(soundOn);
    if(!soundOn)setTimeout(function(){if(!soundOn)AC.suspend();},1200);
    sndBtn.textContent=soundOn?"Mute":"Sound";sndBtn.setAttribute("aria-pressed",String(soundOn));
  }catch(err){console.error(err);sndBtn.textContent="No sound";sndBtn.disabled=true;}
});
document.addEventListener("visibilitychange",function(){if(!AC)return;if(document.hidden)AC.suspend();else if(soundOn)AC.resume();});
window.addEventListener("keydown",function(e){
  if(e.target===slider)return;
  if(e.code==="Space"){e.preventDefault();toggle();}
  else if(e.code==="KeyM"){sndBtn.click();}
  else if(e.code==="ArrowRight"){stop();wakeSound();setT(T+.02);}
  else if(e.code==="ArrowLeft"){stop();wakeSound();setT(T-.02);}
});

slider.max=LAST;
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u+" "+r.status);return r.json();});}
Promise.all([getJSON("data/events.json"),getJSON("data/sources.json")]).then(function(d){
  EVENTS=d[0].events.slice().sort(function(a,b){return a.stage-b.stage;}).slice(0,SHAPE_COUNT);
  d[1].sources.forEach(function(so){SOURCES[so.id]=so;});
  if(EVENTS.length!==SHAPE_COUNT)console.warn("Atlas has "+EVENTS.length+" events; the renderer draws "+SHAPE_COUNT+" shapes.");
  var ticks=document.getElementById("ticks"),names={};
  EVENTS.forEach(function(e,k){
    if(e.camera)CAMS[k]=e.camera;
    // how we leave this stage: 0 morph, +depth zoom in, -depth zoom out
    var tr=e.transition;
    TRANS[k]=!tr||tr.type==="morph"?0:tr.type==="zoom-in"?tr.depth:-tr.depth;
    PACE[k]=tr&&tr.pace?tr.pace:1;
    var i=document.createElement("i");i.textContent=e.tick;ticks.appendChild(i);
    names[e.tick.toLowerCase()]=k;
  });
  reserveText();
  // optional start position: #galaxy, or #t250 for stage 2.5
  var h=(location.hash||"").replace("#","");
  if(/^t\d+$/.test(h))names[h]=parseInt(h.slice(1),10)/100;
  if(names[h]!==undefined)setT(names[h]);
}).catch(function(err){
  console.error(err);
  document.getElementById("title").textContent="The Unfolding";
  document.getElementById("note").textContent="The Atlas could not be loaded, so stage notes are unavailable. The visuals still run.";
});

var warm=0,last=performance.now(),time=0,frames=0,acc=0,fpsEl=document.getElementById("fps");
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  if(glideTo!==null){
    if(playing)glideTo=null;
    else{var gd=glideTo-T;if(Math.abs(gd)<.0005){setT(glideTo);glideTo=null;}else setT(T+gd*Math.min(1,dt*4));}
  }
  if(playing){
    if(phase==="holding"){
      hold-=dt;
      if(hold<=0){
        if(T>=LAST-.001){playing=false;phase="moving";playBtn.textContent="Replay";releaseScreen();ended=true;if(SND&&soundOn)SND.setOn(false,8);}
        else{phase="leaving";hold=TEXT_OUT/1000+.4;}
      }
    }else if(phase==="leaving"){
      hold-=dt;if(hold<=0)phase="moving";
    }else{
      var k0=Math.floor(T+1e-6),fr=T-k0;
      var sp=(.05+.16*Math.pow(Math.sin(Math.PI*fr),2))*(PACE[Math.min(LAST-1,k0)]||1);
      var nt=T+sp*dt;
      if(nt>=k0+1||nt>=LAST){nt=Math.min(LAST,k0+1);phase="holding";hold=dwell(Math.round(nt));}
      setT(nt);
    }
  }
  // text only shows while the visuals rest on a stage
  var near=Math.round(T);
  if(playing?phase==="holding":Math.abs(T-near)<.015)showText(near);else hideText();
  resize();
  shift+=(liftTarget-shift)*Math.min(1,dt*3); // glide, never jump
  var D=cam(T);
  gl.uniform1f(U.uShift,shift);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(U.uT,T);
  gl.uniform1f(U.uTime,time);
  gl.uniform1f(U.uAspect,aspect);
  gl.uniform1f(U.uPx,H);
  gl.uniform1f(U.uCam,D);
  gl.uniform1f(U.uAlpha,.42*Math.sqrt(120000/N));
  gl.uniform2f(U.uField,Math.max(1.5,2.8*aspect),2.8*(1+shift));
  var kk=Math.min(LAST-1,Math.floor(T)),zm=TRANS[kk]||0;
  gl.uniform1f(U.uZoom,zm);
  gl.uniform1f(U.uPass,0);
  gl.drawArrays(gl.POINTS,0,N);
  // a zoom draws the arriving scene too
  if(zm!==0&&T-kk>0){gl.uniform1f(U.uPass,1);gl.drawArrays(gl.POINTS,0,N);}
  if(SND&&soundOn)SND.update(T,zm);
  // warm-up: once the Atlas is in, draw every stage and zoom pass once, invisibly, one per frame
  if(EVENTS.length&&warm<LAST*2){
    var wk=warm>>1;
    gl.colorMask(false,false,false,false);
    gl.uniform1f(U.uT,wk+.5);gl.uniform1f(U.uZoom,TRANS[wk]||0);gl.uniform1f(U.uPass,warm&1);
    gl.drawArrays(gl.POINTS,0,N);
    gl.colorMask(true,true,true,true);
    warm++;
  }
  frames++;acc+=dt;
  if(acc>=1){fpsEl.textContent="prototype 2.1 / "+Math.round(frames/acc)+" fps";frames=0;acc=0;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
