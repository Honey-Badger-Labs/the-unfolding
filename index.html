<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Unfolding Prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2304040b%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%23e8b563%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273%27 fill=%27%23ece8df%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-bleed particle canvas; one instrument strip pinned to the bottom. Single dark theme by choice. */
  color-scheme: dark;
  --void:#04040b;
  --ink:#ece8df;
  --dim:#8f8c9c;
  --line:rgba(236,232,223,.16);
  --gold:#e8b563;
  --observed:#7fd6ff;
  --model:#f2a55c;
  --art:#e07bd0;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--mono);font-size:12px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mark{position:fixed;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--dim);pointer-events:none}
.mark b{color:var(--ink);font-weight:500}
/* the cosmic clock: time since the Big Bang, and how fast it is passing */
.mark,.clock{z-index:2;text-shadow:0 0 2px rgba(4,4,11,.95),0 0 8px rgba(4,4,11,.85),0 1px 20px rgba(4,4,11,.7)}
/* a soft shade behind the top-left text, so it stays readable over the brightest scenes (it vanishes on dark ones) */
.mark::before{content:"";position:fixed;left:0;top:0;width:100%;height:190px;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 520px 190px at 0 0,rgba(4,4,11,.82) 0%,rgba(4,4,11,.72) 28%,rgba(4,4,11,.5) 52%,rgba(4,4,11,.24) 74%,rgba(4,4,11,.07) 90%,rgba(4,4,11,0) 100%)}
.clock{position:fixed;top:36px;left:16px;right:16px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
#clock{color:var(--ink);font-size:12px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
#fromnow{color:var(--ink);font-size:11px;letter-spacing:.04em;opacity:.8;font-variant-numeric:tabular-nums}
#fromnow:empty{display:none}
.mark span,.clock span{white-space:nowrap}
#rate{color:#a9a9bd;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.hud{position:fixed;left:0;right:0;bottom:0;padding:90px 16px 16px;background:linear-gradient(to top,rgba(4,4,11,.9) 0%,rgba(4,4,11,.82) 18%,rgba(4,4,11,.62) 38%,rgba(4,4,11,.38) 58%,rgba(4,4,11,.17) 76%,rgba(4,4,11,.05) 90%,rgba(4,4,11,0) 100%);display:flex;flex-direction:column;gap:12px}
.inner{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.read{display:flex;flex-direction:column;justify-content:flex-start;gap:6px;--ease:cubic-bezier(.16,1,.3,1)}
/* a hidden copy used to measure the tallest stage text, so the panel never changes height */
.measure{position:absolute;left:0;right:0;top:0;visibility:hidden;pointer-events:none}
/* text arrives after the visuals settle: heading first, then era and scale, label, note, sources.
   It leaves in reverse, note first and heading last, before the next visual transition. */
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;opacity:0;filter:blur(12px);transform:translate(var(--dx),var(--dy)) scale(1.8);
  transition:opacity 1.6s var(--ease),filter 1.8s var(--ease),transform 2.2s var(--ease);transition-delay:calc(var(--i)*70ms)}
.read.in .c{opacity:1;filter:blur(0);transform:none}
.read.out .c{opacity:0;filter:blur(10px);transform:translate(calc(var(--dx)*-1.6),calc(var(--dy)*-1.6)) scale(.5);
  transition-duration:1s;transition-timing-function:ease-in;transition-delay:calc(.5s + var(--r)*.5s)}
.meta{opacity:0;filter:blur(6px);transform:translateY(.6em);transition:opacity 1.4s var(--ease),filter 1.6s var(--ease),transform 1.8s var(--ease);transition-delay:var(--meta-at,1.6s)}
.read.in .meta{opacity:1;filter:blur(0);transform:none}
.read.out .meta{opacity:0;transition-duration:.7s;transition-delay:.3s}
.chip{clip-path:inset(0 100% 0 0);transition:clip-path 1.2s var(--ease);transition-delay:var(--chip-at,2.2s)}
.read.in .chip{clip-path:inset(0 0 0 0)}
.read.out .chip{clip-path:inset(0 0 0 100%);transition-duration:.6s;transition-delay:.4s}
.nw{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.5em);
  transition:opacity 1.2s var(--ease),filter 1.2s var(--ease),transform 1.4s var(--ease);transition-delay:calc(var(--note-at,2.8s) + var(--i)*75ms)}
.read.in .nw{opacity:1;filter:blur(0);transform:none}
.read.out .nw{opacity:0;filter:blur(6px);transition-duration:.6s;transition-delay:0s}
.src{opacity:0;transition:opacity 1.2s ease}
.read.in .src{opacity:1;transition-delay:var(--src-at,5s)}
.read.out .src{opacity:0;transition-duration:.4s;transition-delay:0s}
@media (prefers-reduced-motion:reduce){
  .c,.nw,.meta,.chip,.src{filter:none!important;transform:none!important;clip-path:none!important;transition:opacity .3s!important}
}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(26px,5.2vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.chip{border:1px solid currentColor;border-radius:2px;padding:2px 7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.chip.observed{color:var(--observed)}
.chip.model{color:var(--model)}
.chip.art{color:var(--art)}
.meta{color:var(--dim)}
.meta span{color:var(--ink)}
.note{margin:0;max-width:62ch;color:var(--dim)}
.ctl{display:flex;align-items:center;gap:12px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:9px 12px;min-width:68px;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-size:10px}
button:hover{border-color:var(--gold);color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.track{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);margin-top:-9px;box-shadow:0 0 18px rgba(232,181,99,.7)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--gold);box-shadow:0 0 18px rgba(232,181,99,.7)}
.ticks{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ticks i{font-style:normal}
.src{margin:0;font-size:10px;letter-spacing:.04em;color:var(--dim)}
.src a{color:var(--dim);text-decoration:underline;text-underline-offset:2px}
.src a:hover{color:var(--gold)}
.fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
@media (max-width:760px){.ticks i:not(:first-child):not(:last-child){display:none}}
#info{display:none}
/* phones: the picture comes first. Heading, label and era only; Info opens the note and sources */
@media (max-width:600px){
  #fps,#q{display:none}
  #info{display:inline-block}
  .read:not(.open) .note,.read:not(.open) .src,.read:not(.open) .more{display:none}
  .note,.meta{font-size:11px}
  h1{font-size:23px}
  button{min-width:54px;padding:9px 8px}
  .ctl{gap:8px}
  .hud{padding-top:28px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Particle field that changes shape as you move through cosmic time"></canvas>
<div class="mark"><span><b>The Unfolding</b></span><span id="fps">prototype 3.8</span></div>
<div class="clock"><span id="clock"></span><span id="fromnow"></span><span id="rate"></span></div>

<div class="hud">
  <div class="inner">
    <div class="read in" id="read">
      <div class="row"><h1 id="title">The Unfolding</h1><span class="chip model" id="chip">Model-dependent</span></div>
      <div class="meta row"><span id="era">13.8 billion years</span><span class="more" aria-hidden="true">/</span><span class="more" id="scale">one universe</span></div>
      <p class="note" id="note">Loading the Atlas.</p>
      <p class="src" id="src"></p>
    </div>
    <div class="ctl">
      <button id="play" type="button">Play</button>
      <div class="track">
        <input id="t" type="range" min="0" max="10" step="0.001" value="0" aria-label="Position in the journey">
        <div class="ticks" id="ticks"></div>
      </div>
      <button id="snd" type="button" aria-pressed="false" title="Sound (M)">Sound</button>
      <button id="info" type="button" aria-pressed="false" title="Show or hide the stage notes">Info</button>
      <button id="q" type="button" title="Particle count">120k</button>
    </div>
  </div>
</div>
<div class="fail" id="fail">This prototype needs WebGL2. Open it in a current version of Chrome, Safari, Edge or Firefox.</div>

<script src="audio.js"></script>
<script>
(function(){
"use strict";

var VS=`#version 300 es
precision highp float;
layout(location=0) in vec4 aSeed;
uniform float uT,uTime,uAspect,uPx,uCam,uAlpha,uShift,uPass,uZoom,uSpin,uZoom2,uVia,uGrow,uMoon;
uniform vec2 uField;
uniform highp sampler2D uSim;  // the galaxy merger, simulated once on load: one row per star, one column per moment
out vec3 vCol;
out float vA;
const float PI=3.14159265;
const float TAU=6.2831853;
const int ENERGY=1,WEB=2,CLUSTER=3,QUASAR=4,GALAXY=5,HEART=6,NURSERY=7,COLLAPSE=8,FUSION=9,STAR=10,JUPITER=11,MOON=12,WORLDS=13,GIANT=14;
// the galaxy in the protocluster that the camera flies into
const vec3 FC=vec3(.55,-.32,.35);
// a planetary system like ours: four small rocky worlds, then giants beyond the frost line
const float PR[8]=float[8](.3,.42,.56,.72,1.2,1.62,2.05,2.42);
// where each planet starts on its orbit (a table, so every part of the shader agrees to the last bit)
const float PH[8]=float[8](1.3,4.1,2.4,5.6,3.6,.6,4.9,2.);
const float PS[8]=float[8](.008,.013,.014,.010,.05,.042,.028,.027);
const vec3 PC[8]=vec3[8](vec3(.6,.55,.5),vec3(.95,.8,.5),vec3(.3,.55,1.),vec3(.9,.4,.25),vec3(.9,.7,.5),vec3(.95,.85,.6),vec3(.6,.9,.95),vec3(.3,.45,1.));
vec3 s,r2,r3,g; float w;
float eo=0.;   // the Moon's birth: 0 the young Earth, 1 the blue world it became (as we leave)
float mq=0.;   // young galaxy: how far its merger with a neighbour has gone (0 the neighbour still far off, 1 one body)
float gq=1.;   // how far the galaxy has formed; below 1 only while it forms
float wq=1.;   // how far the planets have formed; below 1 only while they form
float bq=1.;   // the first expansion: 0 dense and white-hot, 1 the primordial energy
float fq=.35;  // fusion: how hot and crowded the core is (0 too cool to fuse, 1 ignition)
float gr=1.;   // red giant: its radius relative to full size
float gsh=1.;  // red giant: how visible its shed shells are
float wfl=0.;  // cosmic web: matter streaming along the filaments into the node we dive towards
float gsp=0.;  // galaxy: extra spin as we dive to its centre, fastest near the middle
float kq=0.;   // nursery: how far the knot we dive into has contracted
float jq=1.;   // gas giant: 0 a hot young planet still drawing gas from its disc, 1 formed
float wig=0.;  // set by web(): the order in which its matter first lights up (0 the nodes, 1 mid-filament)
float gf=0.;   // worlds: 1 while the two giants are already formed and the rocky worlds are still gathering
float sat=0.;  // worlds: how close the camera is to the ringed giant (it is drawn in more detail close up)
float dv=1.;   // worlds: how visible the loose dust is (its particles are lent to the ringed giant's close-up)
float wm=1.;   // worlds: how much the camera magnifies it (the star is drawn larger and softer close up)
float jv=1.;   // worlds: how visible its own giant planet is (hidden while the close-up of it is still on screen)
float keep=0.; // set by worlds(): 1 for the planet that survives the red giant (Mars)
vec3 hash33(vec3 p){
  p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));
  return fract(sin(p)*43758.5453);
}
float hash13(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
vec3 flow(vec3 p,float t){
  return vec3(sin(p.y*1.7+t)+sin(p.z*2.3-t*.7),sin(p.z*1.9+t*.8)+sin(p.x*2.1+t),sin(p.x*1.5-t)+sin(p.y*2.7+t*.6));
}
mat2 rot(float a){float c=cos(a),s_=sin(a);return mat2(c,-s_,s_,c);}
float ease(float x){x=clamp(x,0.,1.);return x*x*x*(x*(x*6.-15.)+10.);}
vec3 nodePos(vec3 c){return (c+.5+(hash33(c)-.5)*.85)*.9;}
// the web turns slowly about a tilted axis, so its cells never line up with the view and look flat
vec3 webView(vec3 P){P.xz=rot(.6+uTime*.04)*P.xz;P.yz=rot(.42)*P.yz;P.xy=rot(.25)*P.xy;return P;}

void energy(out vec3 P,out vec3 C,out float S,out float A){
  // the early universe seen from inside: it fills the view and has no centre and no edge.
  // bq=0 is the beginning, dense and white-hot; as space expands everything recedes from everything else,
  // so the glare thins into grains that shrink, cool and redden. bq=1 is the primordial energy
  float hot=1.-bq;
  P=(s*2.-1.)*vec3(uField,2.2);
  P+=flow(P*1.1,uTime*.6)*.22*(1.+1.5*hot);
  float n0=.5+.5*sin(P.x*1.3+P.y*1.9+P.z*1.1+uTime*.4);
  C=mix(vec3(1.,.42,.1),vec3(1.,.14,.55),n0)+vec3(.7,.62,.5)*r2.x*r2.x;
  S=.03+.05*r2.y; A=.5;
  P.z=mix(P.z*.15,P.z,bq);                 // packed close at first, then receding into depth
  S*=mix(6.,1.,bq);
  A*=mix(5.,1.,bq);
  vec3 glare=mix(vec3(1.25,1.2,1.15),vec3(1.25,.85,.38),smoothstep(0.,.55,bq));
  C=mix(glare,C,smoothstep(.25,1.,bq));
  C*=1.+.18*hot*sin(uTime*2.6+P.x*1.7+P.y*2.3);
}

void beginning(out vec3 P,out vec3 C,out float S,out float A){
  // before the first instant: nothing to see. The first expansion is drawn by the transition, from white-hot
  bq=0.; energy(P,C,S,A); bq=1.; A=0.;
}

void web(out vec3 P,out vec3 C,out float S,out float A){
  // cosmic web: jittered nodes joined by curved filaments
  vec3 c=floor((s*2.-1.)*3.);
  vec3 na=nodePos(c);
  float di=floor(r2.x*6.);
  vec3 d=di<1.?vec3(1,0,0):di<2.?vec3(-1,0,0):di<3.?vec3(0,1,0):di<4.?vec3(0,-1,0):di<5.?vec3(0,0,1):vec3(0,0,-1);
  vec3 cb=c+d;
  vec3 nb=nodePos(cb);
  vec3 em=(c+cb)*.5;
  float isFil=step(.32,hash13(em*3.7+1.3))*step(.18,r2.y);
  float u=r2.z;
  if(wfl>0.){
    float toA=step(dot(abs(c),vec3(1.)),.5), toB=step(dot(abs(cb),vec3(1.)),.5);
    u=fract(u+(toB-toA)*wfl);
  }
  vec3 curve=(hash33(em*5.1)-.5)*.55*sin(PI*u);
  vec3 Pf=mix(na,nb,u)+curve+g*.03*(1.+2.5*r3.x*r3.x);
  vec3 Pn=na+g*(.07+.3*r3.y*r3.y*r3.y);
  P=mix(Pn,Pf,isFil);
  C=mix(vec3(1.,.7,.34),mix(vec3(.2,.3,1.),vec3(.25,.7,1.),r3.z),isFil);
  S=mix(.03,.024,isFil); A=mix(.5,.95,isFil);
  // the node we will fly into: a dense, bright knot
  float home=(1.-isFil)*step(dot(abs(c),vec3(1.)),.5);
  P=mix(P,na+g*.09,home);
  C=mix(C,vec3(1.,.92,.8)*1.3,home);
  A=mix(A,.9,home);
  wig=isFil*min(u,1.-u)*2.;
  P=webView(P);
}

void protocluster(out vec3 P,out vec3 C,out float S,out float A){
  // a cluster still assembling: dozens of young galaxies with empty space between them
  float kind=r3.z;
  if(kind<.06){
    P=g*vec3(1.3,1.,1.); C=vec3(.35,.3,.6)*.2; S=.05; A=.25;
  }else if(kind<.13){
    // faint galaxies far behind the cluster
    P=(s*2.-1.)*vec3(3.4,2.1,1.5); C=mix(vec3(.9,.7,.5),vec3(.6,.7,1.),r2.x)*.55; S=.012; A=.5;
  }else{
    // The galaxies come in the kinds we know. Young, gas-rich ones dominate at this epoch: blue spirals and
    // ragged, clumpy irregulars. Smooth red ellipticals and armless lens-shaped discs, whose star-making is
    // over, gather towards the crowded middle, and a giant elliptical is growing at the centre
    float u=r2.z;
    float gi=r2.x*44.;
    float id=u<.1?0.:u<.22?1.:2.+floor(gi);
    float f1=fract(gi);
    vec3 h=hash33(vec3(id,11.,4.));
    float far=pow(hash13(vec3(id,3.,3.)),.6);
    vec3 c=id<.5?FC:id<1.5?vec3(-.3,.12,-.2):normalize(h-.5+1e-4)*2.4*far;
    float sz=id<.5?.12:id<1.5?.2:.07+.1*h.x;
    float ts=hash13(vec3(id,5.,9.));
    float pe=mix(.36,.05,far);
    int type=id<.5?3:id<1.5?0:ts<pe?0:ts<pe+.09?1:ts<pe+.44?2:3;   // elliptical, lenticular, spiral, irregular
    vec3 q; vec3 col;
    if(type==0){
      q=g*sz*(.2+.85*r3.y*r3.y)*vec3(1.,.72+.25*h.z,.8);
      col=mix(vec3(1.05,.8,.5),vec3(1.,.62,.36),r3.y);
    }else if(type==1){
      q=f1<.3?g*sz*.2:g*sz*vec3(1.,1.,.07);
      col=vec3(1.,.84,.58);
    }else if(type==2){
      if(f1<.2){q=g*sz*.17;col=vec3(1.05,.88,.6);}
      else{
        float rad=sz*(.22+1.35*r3.y);
        float th=floor(s.x*2.)*PI+2.4*log(rad/sz+.25)+g.x*.3-uTime*.05;
        q=vec3(rad*cos(th),rad*sin(th),g.z*.04*sz);
        col=r3.x<.12?vec3(1.25,.45,.7):mix(vec3(.5,.68,1.2),vec3(.8,.85,1.05),r3.x);
      }
    }else{
      float ci=floor(s.x*4.);
      vec3 hc=hash33(vec3(id,ci,7.));
      q=(hc-.5)*sz*1.5*vec3(1.,1.,.4)+g*sz*(.2+.25*hc.x);
      col=mix(vec3(.5,.7,1.25),vec3(1.2,.5,.8),step(.6,hc.y))*(.7+.4*r3.x);
    }
    q.xy=rot(h.z*TAU)*q.xy; q.yz=rot(h.x*3.)*q.yz;
    P=c+q;
    C=col*(.6+.5*r3.x);
    if(id<.5)C=mix(vec3(.6,.75,1.3),vec3(1.2,.5,.8),r3.x);
    S=.022; A=id<.5?.22:id<1.5?.13:.18;
  }
}

const int SIMN=101;                      // moments stored per star (keep in step with SIM_SAMPLES below)
vec3 simAt(int i,float f){
  // where star i of the merger simulation is at moment f (0 to SIMN-1), in the simulation's own units
  f=clamp(f,0.,float(SIMN-1));
  int a=int(floor(f)); int b=min(a+1,SIMN-1);
  return mix(texelFetch(uSim,ivec2(a,i),0).xyz,texelFetch(uSim,ivec2(b,i),0).xyz,fract(f));
}

void youngGalaxy(out vec3 P,out vec3 C,out float S,out float A){
  // A young, gas-rich galaxy with a quasar at its heart, and a second galaxy with its own black hole falling in.
  // mq is how far the merger has gone. Their stars move as computed by a restricted N-body simulation
  // (Toomre and Toomre's method: stars feel the pull of both galaxies; the galaxies feel each other and a drag
  // that stands in for dynamical friction). Two passes raise tidal tails and a bridge; the black holes circle
  // each other ever closer and merge, and the merger feeds the quasar
  float f=mq*float(SIMN-1);
  vec3 c1=simAt(0,f), c2=simAt(1,f);
  float sep=length(c2-c1);
  float fin=smoothstep(.88,.98,mq);                  // the last orbits of the two black holes, then one
  vec3 cm=.5*(c1+c2);
  c1=mix(c1,cm,fin); c2=mix(c2,cm,fin);
  vec3 view=simAt(0,0.)*(1.-smoothstep(0.,.45,mq));  // the camera starts on the young galaxy, then frames both
  const float SC=.85;
  float burst=exp(-sep*sep*.9)*smoothstep(.05,.2,mq); // close passes squeeze the gas: a burst of new stars
  float flare=exp(-pow((mq-.98)/.03,2.));             // the two black holes merge
  float kind=r3.z;
  if(r2.y<.05){
    // the black holes: brilliant points where gas spirals in
    vec3 c=r3.x<.5?c1:c2;
    P=(c+g*.025-view)*SC;
    C=vec3(1.3,1.35,1.5)*(1.+.8*burst+1.2*flare)*(r3.x<.5?1.:.85);
    S=.032; A=.9;
  }else if(r2.x<.18){
    // twin jets from the first galaxy's quasar; they fade as the merger begins, and do not return
    float on=1.-smoothstep(.1,.3,mq);
    float side=r3.y<.5?1.:-1.;
    float h=fract(r2.z+uTime*.1*(.6+r3.x));
    float wj=.015+.1*h*h+.35*smoothstep(.8,1.,h);
    P=vec3(g.x*wj,g.y*wj,side*(.08+2.8*h))/SC+(c1-view);
    P*=SC;
    C=mix(vec3(.8,.9,1.2),vec3(.45,.4,1.),h)*(1.-.55*h);
    S=.018; A=.7*on;
  }else{
    // the stars and gas of the two discs
    int i=2+int(floor(r3.y*4094.));
    vec3 p=simAt(i,f);
    p=mix(p,p-(i<2049?simAt(0,f):simAt(1,f))+(i<2049?c1:c2),fin);   // stars stay with their black hole
    vec3 p0=simAt(i,0.)-(i<2049?simAt(0,0.):simAt(1,0.));
    float r0=length(p0);
    float hs=hash13(vec3(float(i),3.,1.));
    bool knot=hs<.07;
    float sp=knot?.04:(kind<.75?.1:.22);
    P=(p+g*sp-view)*SC;
    vec3 young=mix(vec3(1.05,.88,.62),mix(vec3(.55,.72,1.25),vec3(.75,.82,1.1),r2.z),smoothstep(.35,1.,r0));
    C=knot?mix(vec3(1.25,.45,.75),vec3(.6,.8,1.35),step(.6,hs*8.)):young;
    C*=(knot?1.3:.75)*(1.+burst*(knot?1.6:.6));
    if(kind>=.75)C*=.45;
    S=knot?.022:(kind<.75?.026:.04);
    A=knot?.55:(kind<.75?.45:.3);
  }
  P.yz=rot(.62)*P.yz;
}

// the barred spiral: winding of its arms, where they leave the bar, and the arm region we later dive into
const float GK=3.3, GR0=.55, GEDGE=2.85, GRH=1.62;
vec3 galaxyHome(){
  float th=.5-uTime*.025+GK*log(GRH/GR0);
  vec3 p=vec3(GRH*cos(th),GRH*sin(th),0.);
  p.yz=rot(1.05)*p.yz;
  return p;
}
void milkyWay(out vec3 P,out vec3 C,out float S,out float A){
  // a barred spiral like ours, grown from a gas cloud. gq is how far it has formed (0 cloud, 1 finished):
  // the cloud starts compact, puffy and pink; as it forms, the disc spreads and flattens, inner parts
  // spin ahead of outer ones (which winds the arms), and the arms condense out of the haze.
  // Everything turns clockwise, so the arms trail, as in almost every real spiral
  float kind=r3.z;
  float q=gq, nq=1.-q;
  float pat=-uTime*.025;                       // the bar and arm pattern turn together
  float barA=.5+pat;
  float K=GK, R0=GR0, REDGE=GEDGE;
  float spread=mix(.32,1.,pow(q,.7));          // the young disc is compact
  float puff=mix(10.,1.,q);                    // and thick
  float scatter=nq*nq;                         // and has no arms yet
  S=.02; A=.5;
  if(kind<.2){
    // bulge and bar: dense, bright, old and warm; a big glowing cloud before it settles.
    // The bulge is brightest at its very centre and fades into a wide soft glow
    vec3 q3=g*vec3(.48,.15,.13);
    q3.xy=rot(-barA+gsp*1.4)*q3.xy;
    vec3 bul=g*vec3(.34,.34,.25)*(.3+1.25*r3.y*r3.y);
    float isBar=step(.5,r2.x);
    P=mix(bul,q3,isBar)*mix(2.2,1.,q);
    C=mix(vec3(1.,.8,.52),vec3(1.,.93,.8),r2.x)*mix(1.25,1.05,isBar); A=.5;
  }else if(kind<.38){
    // the old disc: smooth and dim, densest in the middle. Its stars orbit faster than the arm pattern
    // inside, slower outside, passing through the arms; dark dust lanes lie along the arms' inner edges
    float r=min(REDGE,.12-.62*log(1.-.96*r2.x));
    float th=s.y*TAU-uTime*.05/(r+.25)-gsp*.9/(r+.3);
    P=vec3(r*cos(th),r*sin(th),g.z*.035*puff);
    C=vec3(1.,.86,.66)*mix(.72,.4,smoothstep(.5,2.6,r));
    float ph=mod(th-barA-K*log(max(r,R0)/R0),PI);
    float lane=smoothstep(.015,.07,ph)*(1.-smoothstep(.24,.4,ph))*smoothstep(R0,R0+.2,r)*q;
    A=.45*(1.-.95*lane);
    P.xy*=spread;
  }else if(kind<.395){
    // the halo: old globular clusters swarming round the centre, far above and below the disc
    float id=floor(r2.x*70.);
    vec3 h=hash33(vec3(id,6.,3.));
    vec3 c=normalize(h-.5+1e-4)*(.35+2.1*pow(hash13(vec3(id,1.,7.)),1.6))*spread;
    P=c+g*.012;
    C=vec3(1.,.88,.7)*.6; S=.013; A=.38*q;
  }else{
    // spiral arms: two major off the bar ends, two minor between; thick and bright near the centre,
    // thinning and fading towards the edge; yellower inside, bluer outside
    float pick=r2.y;
    float a0=pick<.35?0.:pick<.70?PI:pick<.85?PI*.5:PI*1.5;
    float major=step(pick,.70);
    float rs=mix(.95,R0,major);
    float knot=step(r3.x,.1);
    float spur=step(.1,r3.x)*step(r3.x,.27);
    float tr=pow(s.x,1.35);
    // gas and young stars bunch along the arm, like beads on a string
    tr+=(.0075*sin(tr*83.+a0*5.)+.016*sin(tr*29.+a0*2.+1.))*(1.-knot);
    float kid=floor(s.x*34.);
    vec3 kh=hash33(vec3(kid,a0,2.));
    if(knot>.5)tr=pow(kh.x,1.2);
    // spurs: short feathers that leave an arm's outer edge at a steeper angle
    float sid=floor(s.x*13.);
    float su=r2.z;
    if(spur>.5)tr=.08+.8*hash13(vec3(sid,a0,5.));
    float home=0.;
    if(knot>.5&&kid<1.&&a0<.1){home=1.;tr=(GRH-rs)/(REDGE-rs);}   // the star-forming region we will dive into
    float r=rs+(REDGE-rs)*clamp(tr,0.,1.);
    float edge=smoothstep(rs,REDGE,r);         // 0 at the arm's root, 1 at the rim
    float th=a0+barA+K*log(r/R0);
    if(spur>.5){float r1=r*(1.+.46*su);th+=1.15*log(r1/r);r=r1;}
    th-=gsp*.9/(r+.3);
    float thk=th;
    float cloud=(1.-knot)*step(hash13(s*7.3+w),.42);
    float width=mix(.4,.11,edge)*mix(1.,1.9,cloud)*mix(1.,.4,knot)*mix(1.,.4,spur);
    if(major<.5)width*=.7;
    th-=abs(g.x)*width/r;
    th+=cloud*g.y*.05/r;
    // formation: no arm structure at first, then differential spin winds the arms into place
    th+=scatter*(r3.y-.5)*TAU*.9+nq*nq*3.5/(r*spread+.25);
    float rr=r+g.y*mix(.05,.14,cloud)*mix(1.4,.6,edge)*mix(1.,.5,spur);
    P=vec3(rr*cos(th),rr*sin(th),g.z*mix(.03,.065,cloud)*mix(1.6,.7,edge)*puff);
    P.xy*=spread;
    vec3 young=mix(vec3(.62,.58,1.2),vec3(.85,.85,1.05),r2.x);
    vec3 older=vec3(1.,.86,.66);
    float fade=mix(1.15,.42,edge)*mix(1.,.95*(1.-.6*su),spur);
    C=mix(older,young,smoothstep(.15,.7,edge))*(.55+.5*r3.y)*mix(.72,1.,major)*fade;
    if(cloud>.5){C=mix(vec3(.5,.45,1.05),vec3(.95,.45,.8),r3.y)*mix(.45,.6,major)*fade;S=.055;A=.16;}
    if(knot>.5){
      // glowing hydrogen where stars are being born, and the hot blue clusters that just formed there
      float big=step(kh.y,.25);
      float blue=step(.62,kh.z);
      float kr=mix(.014,.034,big)*(1.+.6*home);
      float ko=(kh.z-.3)*1.2*width/r+blue*.03/r;         // young clusters drift just downstream of the gas that made them
      thk+=nq*nq*3.5/(r*spread+.25)-ko-abs(g.x)*.012/r;
      P=vec3(r*cos(thk),r*sin(thk),0.)*spread+g*kr*vec3(1.,1.,.6);
      C=mix(vec3(1.25,.36,.58),vec3(.7,.82,1.3),blue)*mix(1.,.7,edge)*(.6+.5*r2.x);S=mix(.02,.03,big);A=.42*q;
    }
  }
  // the forming galaxy glows pink with gas
  C=mix(vec3(1.,.48,.6)*.55*(.6+.6*r3.y),C,smoothstep(0.,.75,q));
  P.yz=rot(1.05)*P.yz;
}

void heart(out vec3 P,out vec3 C,out float S,out float A){
  // a supermassive black hole: its ring of light, its disc, and stars whipping round it
  float kind=r3.z;
  float a=s.y*TAU;
  if(kind<.16){
    float r=.62+abs(g.x)*.025;
    float a2=a+uTime*.6;
    P=vec3(r*cos(a2),r*sin(a2),0.);
    C=vec3(1.,.84,.55)*(.5+.5*cos(a2-2.6));
    S=.016; A=.8;
  }else if(kind<.34){
    float r=.66+.32*s.x*s.x;
    float a2=a+uTime*.3;
    P=vec3(r*cos(a2),r*sin(a2),0.);
    C=vec3(1.,.5,.18)*(.3+.3*cos(a2-2.6))*(1.-smoothstep(.66,.98,r));
    S=.022; A=.5;
  }else if(kind<.94){
    float r=.95+1.9*pow(s.x,1.6);
    // the disc turns so that its left side comes towards us: Doppler beaming makes that side brighter
    float th=a-uTime*1.6/pow(r,1.5);
    P=vec3(r*cos(th),r*sin(th),g.z*.02*r);
    P.yz=rot(1.3)*P.yz;
    C=mix(vec3(1.,.9,.7),vec3(.9,.22,.07),smoothstep(.95,2.4,r));
    C*=(.3+.7*(.5-.5*cos(th)))*(.7+.3*sin(r*18.+r2.x));
    S=.02; A=.55;
  }else{
    float id=floor(s.x*14.);
    vec3 h=hash33(vec3(id,4.,8.));
    float sa=1.2+2.2*h.x, e=.3+.5*h.y;
    float M=h.z*TAU+uTime*2.2/pow(sa,1.5);
    float r=sa*(1.-e*e)/(1.+e*cos(M));
    float om=hash13(vec3(id,9.,1.))*TAU;
    P=vec3(r*cos(M+om),r*sin(M+om),0.);
    P.yz=rot(hash13(vec3(id,5.,6.))*PI)*P.yz;
    P+=g*.006;
    C=mix(vec3(.6,.75,1.),vec3(1.,.8,.55),h.y)*.8; S=.016; A=.45;
  }
}

// the pillars of the stellar nursery: base, tip and half-width (a scene like the Pillars of Creation)
const vec2 PB[3]=vec2[3](vec2(-1.55,-1.75),vec2(-.25,-1.75),vec2(1.,-1.75));
const vec2 PT[3]=vec2[3](vec2(-1.15,.7),vec2(-.05,.25),vec2(.6,-.2));
const float PWD[3]=float[3](.52,.43,.36);
// how far a point is from the nearest pillar's axis, in pillar half-widths (below 1 is inside)
float pillarDist(vec2 p){
  float best=9.;
  for(int i=0;i<3;i++){
    vec2 ab=PT[i]-PB[i];
    float t=clamp(dot(p-PB[i],ab)/dot(ab,ab),0.,1.);
    float wd=PWD[i]*(1.-.5*t);
    best=min(best,length(p-(PB[i]+ab*t))/wd);
  }
  return best;
}

void nursery(out vec3 P,out vec3 C,out float S,out float A){
  // pillars of cold gas and dust rising into a glowing cloud. Hot young stars above erode them:
  // their edges glow gold, the gas shines red (hydrogen) turning green-teal (oxygen) near the stars,
  // and dense knots at the tips are where new stars begin
  float kind=r3.z;
  if(kind<.08){
    // knots at the pillar tips; the first is the one the camera dives into
    float id=floor(r2.x*5.);
    vec2 kc=id<1.?PT[2]:id<2.?PT[0]:id<3.?PT[1]:mix(PB[1],PT[1],.55+.3*hash13(vec3(id,2.,2.)));
    float mine=step(id,.5)*kq;
    P=vec3(kc,0.)+g*(.04+.1*r3.x*r3.x)*(1.-.6*mine);
    C=vec3(1.,.45,.22)*(.35+.4*r3.y)*(1.+1.2*mine); S=.022; A=.3;
  }else if(kind<.40){
    // the pillars: dark dusty interiors, edges and tips lit gold by the stars above
    int i=r2.z<.45?0:r2.z<.78?1:2;
    float t=pow(r3.x,.75);
    vec2 ab=PT[i]-PB[i];
    vec2 n=normalize(vec2(-ab.y,ab.x));
    float wd=PWD[i]*(1.-.5*t);
    float u=clamp(g.x*.45,-1.1,1.1);
    vec2 c=PB[i]+ab*t+n*u*wd;
    P=vec3(c,g.z*wd*.55);
    P.xy+=flow(P*3.+float(i),uTime*.02).xy*.03*wd*4.;
    float edge=smoothstep(.35,.9,abs(u))*(.55+.45*t);
    float tip=smoothstep(.85,1.,t)*.7;
    float lit=max(edge,tip);
    C=mix(vec3(.55,.3,.17)*.45,vec3(1.05,.72,.4),lit)+vec3(.06,.22,.1)*tip;
    S=.032; A=mix(.3,.5,lit);
  }else if(kind<.41){
    // the young, hot stars above the pillars
    P=vec3(.4,1.35,-.4)+g*vec3(1.3,.25,.4);
    C=vec3(.75,.85,1.1); S=r3.y<.2?.05:.03; A=.6;
  }else if(kind<.43){
    // stars scattered through the field
    float id=floor(r2.x*60.);
    P=(hash33(vec3(id,8.,2.))*2.-1.)*vec3(2.8,1.7,.9)+g*.004;
    C=vec3(.85,.88,1.); S=.016; A=.45;
  }else{
    // the glowing cloud: red hydrogen, green-teal oxygen near the stars, gold along the pillar edges;
    // nothing glows from behind a pillar, so the pillars stand out dark against it
    P=(s*2.-1.)*vec3(2.9,1.75,1.1);
    P+=flow(P*1.3,uTime*.03)*.34;
    P+=flow(P*2.9+7.,uTime*.05)*.14;
    float n=sin(P.x*2.1+sin(P.y*3.)*1.3)+sin(P.y*1.7+P.z*2.);
    float lit=smoothstep(-.5,.8,n);
    float hy=(P.y+1.75)/3.5;
    float ox=smoothstep(.45,1.,hy+.3*sin(P.x*1.1+P.z*2.3)+.25*(r2.x-.5));
    C=mix(vec3(1.3,.14,.2),vec3(.2,1.,.55),ox);
    C=mix(C,vec3(1.05,.5,.12),smoothstep(.55,1.,sin(P.x*3.7+P.y*2.9)*.5+.5)*.5*(1.-ox));   // amber dust
    vec2 hs=(P.xy-vec2(.4,1.1))*vec2(.55,.95);
    C=mix(C,vec3(.3,.5,1.3),.75*exp(-dot(hs,hs)));                                          // blue glow round the hot stars
    float d=pillarDist(P.xy);
    float rim=exp(-pow((d-1.)*3.,2.));
    C=mix(C,vec3(1.2,.8,.4),rim*.5)*(.1+.85*lit)*(1.+1.2*rim);
    S=.05; A=.3;
    if(P.z<.6)A*=1.-.92*(1.-smoothstep(.75,1.15,d));
  }
}

void protostar(out vec3 P,out vec3 C,out float S,out float A){
  // a newborn star still buried in its cloud, like those Webb images: gas spirals in along streamers,
  // spinning faster as it falls, and flattens into a disc; twin jets with glowing knots end in bow shocks;
  // hourglass cavities carved by the outflow glow faintly in scattered starlight
  float kind=r3.z;
  if(kind<.05){
    P=normalize(g+vec3(1e-4))*.07*pow(r3.y,.4); C=vec3(1.,.6,.32)*1.1; S=.03; A=.8;
  }else if(kind<.25){
    // the young disc
    float r=.12+.7*sqrt(s.x);                       // out to the centrifugal radius, where the infall lands
    float th=s.y*TAU+uTime*.6/(pow(r,1.5)+.1);
    P=vec3(r*cos(th),r*sin(th),g.z*.04*(.3+r));
    C=mix(vec3(1.,.62,.3),vec3(.6,.22,.1),r); S=.02; A=.5;
  }else if(kind<.62){
    // Rotating collapse (the Ulrich 1976 / Cassen-Moosman 1981 solution). Each parcel of gas falls freely on a
    // parabolic orbit about the star, keeping its angular momentum. Starting from polar angle theta0 it follows
    //   r = rc sin^2(theta0) / (1 - cos(theta)/cos(theta0)),   cos(phi - phi0) = tan(theta0)/tan(theta)
    // and lands on the disc at r = rc sin^2(theta0): gas from near the poles lands close in, gas from near the
    // equator at the disc's edge rc. Free fall gives r proportional to (time left)^(2/3), so the density
    // climbs inward as r^(-3/2) and the gas speeds up as it nears the star.
    float rc=.82, rmax=2.7;
    float mu0=(r2.x*2.-1.)*.9;                       // cos(theta0); the polar caps are swept clear by the outflow
    mu0=sign(mu0+1e-5)*max(abs(mu0),.03);
    float sin0=sqrt(1.-mu0*mu0);
    float rland=rc*sin0*sin0;
    float u=fract(s.x+uTime*.03);
    float uland=1.-pow(rland/rmax,1.5);
    float r=max(rland,rmax*pow(max(1.-u,0.),.6667));
    float mu=mu0*(1.-rland/r);                       // cos(theta) along the streamline
    float sn=sqrt(max(1.-mu*mu,1e-6));
    float phi0=s.y*TAU;
    float phi=phi0+acos(clamp(sin0*(1.-rland/r)/sn,0.,1.));
    // once landed, the parcel is part of the disc and orbits at the Keplerian rate
    phi+=max(u-uland,0.)/.03*.6/(pow(rland,1.5)+.1);
    P=r*vec3(sn*cos(phi),sn*sin(phi),mu)+g*.025*(.4+r);
    // the infall is clumpy: brighter along a few streamers
    float stream=.3+.9*pow(.5+.5*sin(phi0*3.+mu0*5.+1.7*sin(phi0*2.)),2.);
    float shock=exp(-pow((u-uland)*30.,2.));         // the flash where the gas hits the disc
    C=mix(vec3(.85,.3,.16),vec3(1.2,.62,.26),1.-smoothstep(.3,2.4,r))*stream*1.5+vec3(1.,.8,.5)*shock;
    C*=smoothstep(0.,.06,u)*(1.-smoothstep(.93,1.,u));
    S=.03; A=.5;
  }else if(kind<.74){
    // the hourglass cavities the outflow has carved, lit faintly blue by scattered starlight
    float side=r2.z<.5?1.:-1.;
    float u=pow(s.x,.8);
    float cr=(.12+.75*pow(u,.65))*(1.+g.x*.08);
    float a=s.y*TAU;
    P=vec3(cr*cos(a),cr*sin(a),side*(.08+2.1*u));
    C=vec3(.45,.6,1.)*(.25+.35*(1.-u)); S=.026; A=.3;
  }else if(kind<.80){
    // what is left of the surrounding cloud
    vec3 d2=normalize(hash33(s*17.3+w*5.1)-.5+vec3(1e-4));
    P=d2*(1.+1.6*sqrt(r3.x)); C=vec3(.4,.15,.1)*.25; S=.04; A=.25;
  }else{
    float side=r3.y<.5?1.:-1.;
    if(r2.x<.25){
      // a bow shock where the jet slams into the cloud
      float a=s.y*TAU, rr=.28*sqrt(s.x);
      P=vec3(rr*cos(a),rr*sin(a),side*(2.35-1.6*rr*rr))+g*.02;
      C=mix(vec3(1.2,.3,.25),vec3(1.1,.6,.3),s.x); S=.022; A=.45;
    }else{
      // the jet itself, studded with glowing knots
      float h=fract(r2.z+uTime*.08);
      float wj=.01+.03*h;
      P=vec3(g.x*wj,g.y*wj,side*(.1+2.2*h));
      float knot=pow(.5+.5*sin(h*26.-uTime*1.2),6.);
      C=mix(vec3(.55,.75,1.)*.5,vec3(1.25,.28,.22),knot)*(.35+.9*knot);
      S=.018; A=.6;
    }
  }
  P.yz=rot(1.12)*P.yz;
}

void fusion(out vec3 P,out vec3 C,out float S,out float A){
  // the core of the collapsing cloud at the scale of atomic nuclei, drawn enormously larger and slower
  // than real. Hydrogen nuclei rush about and repel each other; hotter and more crowded, some pairs are
  // forced close enough to fuse, and each fusion releases a burst of energy.
  // fq runs from 0 (too cool to fuse) to 1 (ignition: fusion everywhere, holding the star up)
  float heat=mix(.55,1.5,fq);
  float crowd=mix(1.2,.78,fq);
  if(r3.z<.14){
    // the restless haze between them: free electrons and light
    P=(s*2.-1.)*vec3(3.,1.8,1.);
    P+=flow(P*2.3,uTime*1.4)*.12*heat;
    C=mix(vec3(.9,.4,.2),vec3(1.2,1.,.8),fq)*(.12+1.1*fq*fq*fq); S=.014+.02*fq; A=.5;
    return;
  }
  float id=floor(r2.x*110.);
  float pair=floor(id*.5), side=mod(id,2.)*2.-1.;
  vec3 h=hash33(vec3(pair,3.,9.));
  vec3 c=(h*2.-1.)*vec3(2.5,1.4,.7)*crowd;
  c+=flow(c*.7+pair,uTime*.25)*.18;
  float tt=uTime*.14*(.6+.8*hash13(vec3(pair,1.,1.)))+h.x*7.;
  float cyc=floor(tt), ph=fract(tt);
  float fuses=step(hash13(vec3(pair,cyc,5.)),fq*fq*.92);
  vec3 ax=normalize(hash33(vec3(pair,cyc,2.))-.5+vec3(1e-4)); ax.z*=.35;
  float close=mix(.13,0.,fuses);                       // repulsion turns most pairs back
  float d=ph<.5?mix(.6,close,ease(ph*2.)):mix(close,.6,ease((ph-.5)*2.));
  float merged=fuses*step(.5,ph);
  d*=1.-merged;
  vec3 jit=vec3(sin(uTime*13.+id*1.3),cos(uTime*17.+id*2.1),sin(uTime*11.+id))*.022*heat;
  float e=(ph-.5)*2.;                                  // time since the fusion, 0 to 1
  float edge=smoothstep(0.,.08,ph)*(1.-smoothstep(.92,1.,ph));
  if(merged>.5&&r3.y<.45){
    // the energy released: a burst of light racing outward
    vec3 dir=normalize(g+vec3(1e-4));
    P=c+dir*(.04+1.5*e);
    C=vec3(1.3,1.2,1.)*(1.-e)*(1.-e)*1.6; S=.024; A=.8;
  }else{
    P=c+ax*side*d+jit+g*.055*(1.+.35*merged);
    float near=1.-smoothstep(.13,.45,d);               // they glow as they are forced together
    C=mix(vec3(1.,.36,.3),vec3(1.1,.85,.45),merged)*(.55+.6*near);
    C+=vec3(1.,.95,.8)*fuses*exp(-pow((ph-.5)*16.,2.))*2.;
    C*=1.-merged*smoothstep(.75,1.,e);
    S=.032; A=.1*edge;
  }
  C+=vec3(.5,.4,.3)*pow(fq,5.)*.5;
}

vec3 giantPlanetPos(){
  // where the system's largest planet is on its orbit, in the plane of the system (before its tilt)
  float pr=PR[4];
  float ph=PH[4]+uTime*.18/(pow(pr,1.5)+.05);
  return vec3(pr*cos(ph),pr*sin(ph),0.);
}

vec3 planetPos(int i){
  // where a planet is on its orbit, as seen (the system's plane is tilted towards us)
  float pr=PR[i];
  float ph=PH[i]+uTime*.18/(pow(pr,1.5)+.05);
  vec3 p=vec3(pr*cos(ph),pr*sin(ph),0.);
  p.yz=rot(1.12)*p.yz;
  return p;
}

void youngStar(out vec3 P,out vec3 C,out float S,out float A){
  // the star ignites; its dusty disc shows rings and gaps
  float rr=.12+2.3*sqrt(s.x);
  rr+=.07*sin(rr*11.);
  float th=s.y*TAU+uTime*.35/(pow(rr,1.5)+.15);
  P=vec3(rr*cos(th),rr*sin(th),(s.z-.5)*.05*(1.+rr*1.5));
  float core=step(r2.y,.09);
  P=mix(P,g*.13,core);
  C=mix(vec3(1.,.74,.3),vec3(.85,.4,.18),smoothstep(.3,1.6,rr));
  C=mix(C,mix(vec3(.3,.7,.45),vec3(.8,.2,.12),r3.x),smoothstep(1.2,2.4,rr)*r3.z);
  C=mix(C,vec3(1.,.93,.75),core);
  S=mix(.02,.035,core); A=mix(.5,.85,core);
  if(core<.5&&r3.y<.02){
    // a clump of gas and dust beyond the frost line: the seed of a giant planet
    P=giantPlanetPos()+g*.03; C=vec3(1.2,.8,.45); S=.022; A=.4;
  }
  P.yz=rot(1.12)*P.yz;
}

void jupiter(out vec3 P,out vec3 C,out float S,out float A){
  // a gas giant like Jupiter, seen from 26 degrees above its equator (the tilt of the whole system).
  // Its fast spin drives alternating east and west jet streams, which draw the clouds into dark belts and
  // bright zones; a great anticyclone turns counter-clockwise in the southern hemisphere.
  // jq runs from 0 (a hot young planet still drawing gas from the disc around it) to 1 (formed)
  float t=uSpin;                                     // seconds since we came to this planet: its storm starts in view
  float R=1.3*mix(.72,1.,jq);
  float kind=r3.z;
  if(kind<.035){
    // the auroras: rings of light round the magnetic poles, where particles from the planet's magnetosphere
    // rain into the upper atmosphere. They shine in ultraviolet; shown here in false colour, as Hubble shows them
    float pole=r2.x<.75?1.:-1.;
    float ao=r2.z*TAU;
    float h=pow(fract(s.x*17.),2.);                  // curtains: brightest at the base, fading upward
    float co=.25+.03*sin(ao*3.+1.)+.01*g.x;            // the oval sits about 15 degrees from the pole, off-centre
    vec3 an=normalize(vec3(co*cos(ao)+.05,co*sin(ao),pole));
    vec3 pp=an*R*(1.01+.07*h); pp.z*=.935;
    pp.yz=rot(1.12)*pp.yz;
    P=pp;
    float flick=.6+.4*sin(ao*9.+t*1.7)*sin(ao*4.-t*.9);
    C=mix(vec3(.45,.6,1.5),vec3(1.,.4,1.3),h)*(1.-h)*flick*(1.+1.5*exp(-pow(mod(ao-1.,TAU)-PI,2.)*6.));
    S=.03; A=.3*jq;
    if(P.z<0.&&length(P.xy)<R*.99)A=0.;
  }else if(kind<.8){
    vec3 d=normalize(hash33(s*17.3+w*5.1)-.5+vec3(1e-4));
    d.z=abs(d.z);                                    // the face towards us
    vec3 q=d; q.yz=rot(-1.12)*q.yz;                  // the planet's own frame: q.z is the spin axis
    float lat=asin(clamp(q.z,-1.,1.));
    float lon=atan(q.y,q.x);
    float wind=.5*cos(lat*7.)*exp(-lat*lat*1.2)+.12*cos(lat*15.);   // zonal jets, strongest at the equator
    float L=lon-t*.045;                              // the planet turns: one ten-hour day in about two minutes
    float La=L-wind*t*.12;                           // each band's clouds ride its own wind
    float turb=sin(La*6.+2.*sin(lat*22.))*sin(lat*37.+La*2.)+.5*sin(La*13.-lat*50.);
    float band=.5+.5*cos((lat+.022*turb)*13.+.5*sin(lat*4.));
    vec3 col=mix(vec3(.74,.43,.24),vec3(1.,.93,.8),smoothstep(.25,.75,band));   // belts and zones
    col=mix(col,vec3(.95,.72,.5),.35*exp(-lat*lat*30.)*(.5+.5*turb));           // festoons along the equator
    col=mix(col,vec3(.5,.52,.58),smoothstep(.95,1.35,abs(lat)));               // grey-blue polar hazes
    vec2 sp=vec2(mod(L+2.02+PI,TAU)-PI,lat+.38)/vec2(.27,.13);                  // the Great Red Spot
    float rho=length(sp);
    float spot=1.-smoothstep(.75,1.,rho);
    float swirl=.5+.5*sin(atan(sp.y,sp.x)*2.+rho*7.-t*.5);
    col=mix(col,vec3(1.,.95,.85),(1.-spot)*exp(-pow((rho-1.15)*5.,2.))*.5);    // the pale collar round it
    col=mix(col,mix(vec3(.82,.3,.17),vec3(.95,.5,.3),swirl),spot);
    col=mix(vec3(1.25,.7,.32)*(.75+.25*turb),col,jq);                          // young: glowing with its own heat
    vec3 pp=q*R; pp.z*=.935;                         // flattened by its spin
    pp.yz=rot(1.12)*pp.yz;
    P=pp*(1.+.006*g.x);
    vec3 jp=giantPlanetPos(); jp.yz=rot(1.12)*jp.yz;
    vec3 Ld=normalize(-normalize(jp)+vec3(0.,0.,1.1));                         // sunlight from the star
    float day=mix(1.,smoothstep(-.3,.45,dot(d,Ld)),jq);
    float mu=d.z;
    C=col*mix(.4,1.,pow(mu,.6))*mix(.07,1.,day);
    S=.075; A=.22*max(mu,.12);
  }else if(kind<.83){
    // four large moons, gathered from the disc that fed the planet (their orbits are drawn much closer in)
    float id=floor(r2.x*4.);
    float mr=R*(1.35+.3*id+.0167*id*id);
    float ma=hash13(vec3(id,6.,2.))*TAU+t*.9/pow(mr,1.5);
    P=vec3(mr*cos(ma),mr*sin(ma),0.)+g*.016;
    P.yz=rot(1.12)*P.yz;
    C=id<1.?vec3(1.,.85,.4):id<2.?vec3(.9,.9,.95):id<3.?vec3(.75,.7,.65):vec3(.5,.47,.45);
    S=.018; A=.1*smoothstep(.6,1.,jq);
    if(P.z<0.&&length(P.xy)<R)A=0.;
  }else{
    // the disc of gas and dust round the young planet: it feeds the planet, then clears
    float r=R*(1.25+1.5*sqrt(s.x));
    float th=s.y*TAU+t*.8/pow(r,1.5);
    r+=.05*sin(th*2.+r*9.);
    P=vec3(r*cos(th),r*sin(th),g.z*.03*r);
    P.yz=rot(1.12)*P.yz;
    C=mix(vec3(1.1,.62,.28),vec3(.6,.3,.15),smoothstep(R*1.3,R*2.7,r));
    S=.026; A=.42*(1.-smoothstep(.2,.95,jq));
    if(P.z<0.&&length(P.xy)<R*.98)A=0.;
  }
}

void worlds(out vec3 P,out vec3 C,out float S,out float A){
  // planets grow out of the dust disc. wq is how far they have formed (0 dust rings, 1 finished):
  // dust drifts along each ring and gathers on a growing clump, the lanes thin to faint lines,
  // the star at the centre settles and brightens
  float q=wq;
  keep=0.;
  float kind=r2.x;
  // close to the ringed giant, most of the system's loose dust is out of sight: those particles draw the planet
  // and its rings instead, so that it holds up as well as the stage before it
  bool close=sat>0.&&kind>=.56&&r3.z<.8;
  int ip=close?5:int(min(floor(s.x*8.),7.));
  float pr=PR[ip];
  float om=.18/(pow(pr,1.5)+.05);
  float a=s.y*TAU+uTime*om;
  float ph=PH[ip]+uTime*om;                 // where this ring's planet is
  float dw=.09+.05*pr;                      // the dust ring's width
  vec3 dustC=mix(vec3(1.,.74,.3),vec3(.85,.4,.18),smoothstep(.3,1.6,pr))*mix(1.05,.6,q);
  float qp=(ip==4||ip==5)?max(q,gf):q;      // the giants form first, while gas is plentiful
  S=.014; A=.6;
  if(kind<.42||close){
    // material that becomes the planet: arrivals are staggered, so the clump grows over time
    float arrive=close?1.:smoothstep(r3.x*.75,r3.x*.75+.25,qp);
    float da=mod(a-ph+PI,TAU)-PI;
    float ang=ph+da*(1.-arrive);
    float rad=pr+g.x*dw*(1.-arrive);
    vec3 off=g*PS[ip];
    vec3 pc=PC[ip]*(.6+.5*r3.x);
    float ps=.018, pa=max(.012,.05*pow(PS[ip]/.05,2.));
    if(ip==5){
      // the ringed giant, like Saturn: a banded, flattened globe, and rings of ice in the plane of its equator
      // (drawn in the plane of the system). Ring radii follow Saturn's: the faint C ring, the bright B ring,
      // the dark Cassini division, the A ring with its narrow Encke gap
      const float RP=.039;
      vec3 sun=-normalize(vec3(cos(ph),sin(ph),0.));
      float cl=close?sat:0.;
      if(r3.y<.5){
        vec3 d=normalize(hash33(s*17.3+w*5.1)-.5+vec3(1e-4));
        d.z=abs(d.z);                                  // the face towards us
        vec3 qn=d; qn.yz=rot(-1.12)*qn.yz;             // the planet's own frame: qn.z is the spin axis
        float lat=asin(clamp(qn.z,-1.,1.));
        vec3 col=mix(vec3(.3,.46,.78),vec3(.66,.8,1.),smoothstep(.2,.8,.5+.5*cos(lat*14.+.7*sin(lat*5.))));
        col=mix(col,vec3(.78,.86,1.),.3*exp(-lat*lat*40.));
        col=mix(col,vec3(.5,.62,.8),smoothstep(1.,1.4,abs(lat)));
        // the hemisphere in winter turns blue: its cloud tops lie deeper under clear air (as Cassini saw the north)
        col=mix(col,mix(vec3(.36,.56,.95),vec3(.6,.76,1.),.5+.5*cos(lat*14.)),smoothstep(.12,.5,lat));
        off=qn*RP; off.z*=.9;                          // flattened by its spin
        if(r3.x<.07){
          // aurora round the north pole (it shines in ultraviolet: shown here in false colour)
          float ao=r2.z*TAU, h=pow(fract(s.x*13.),2.);
          vec3 an=vec3(.27*cos(ao),.27*sin(ao),.96); an=normalize(an);
          off=an*RP*(1.02+.08*h); off.z*=.9;
          vec3 v=off; v.yz=rot(1.12)*v.yz;
          col=mix(vec3(.5,.7,1.4),vec3(.9,.45,1.3),h)*(1.-h)*(.6+.6*sin(ao*7.+uTime*1.3));
          d=vec3(0.,0.,1.);
          if(v.z<0.&&length(v.xy)<RP*.97)col=vec3(0.);
        }
        vec3 sv=sun; sv.yz=rot(1.12)*sv.yz;
        float day=smoothstep(-.3,.45,dot(d,normalize(sv+vec3(0.,0.,1.1))));
        pc=col*mix(.4,1.,pow(d.z,.6))*mix(.1,1.,day);
        ps=mix(.018,.075,cl); pa=mix(.035,.3*max(d.z,.12),cl);
      }else{
        float x=mix(1.24,2.27,pow(fract(r3.y*2.),.85));
        float br=x<1.53?.22:x<1.95?1.:x<2.02?.04:(abs(x-2.21)<.012?.08:.6);
        float rt=(s.y+r2.z*7.)*TAU+uTime*.5/pow(x,1.5);
        off=vec3(cos(rt),sin(rt),0.)*x*RP;
        float along=dot(off,-sun);
        if(along>0.&&length(off+sun*along)<RP*.95)br*=.06;   // the planet's shadow falls across the rings
        pc=vec3(.97,.9,.75)*br*(.75+.25*sin(x*140.));
        ps=mix(.012,.06,cl); pa=mix(.03,.45,cl);
        vec3 v=off; v.yz=rot(1.12)*v.yz;
        if(v.z<0.&&length(v.xy*vec2(1.,1.08))<RP*.97)pa=0.;  // behind the globe
      }
    }
    if(ip==4)pa*=jv;
    if(close)pa*=sat;
    P=vec3(rad*cos(ang),rad*sin(ang),g.z*.03*(1.-arrive))+off*arrive;
    C=mix(dustC,pc,arrive);
    S=mix(.016,ps,arrive);
    A=mix(.5,pa,pow(arrive,.6));
    keep=ip==3?1.:0.;
  }else if(kind<.56){
    // the ring's lane: a band of dust that thins to a faint orbit line
    float rad=pr+g.x*dw*(1.-qp)+g.x*.004*qp;
    P=vec3(rad*cos(a),rad*sin(a),g.z*.03*(1.-qp));
    C=mix(dustC,vec3(.5,.5,.58)*.16,qp);
    A=mix(.5,.6,qp);
  }else if(kind<.65){
    // the asteroid belt: leftovers between the rocky worlds and the giants
    float r=.94+g.x*mix(.14,.07,q);
    P=vec3(r*cos(a),r*sin(a),g.z*.02); C=mix(dustC,vec3(.6,.5,.4)*.4,q); S=.012; A*=dv;
  }else if(kind<.80){
    // the outer belt of icy leftovers
    float r=2.8+g.x*mix(.25,.14,q);
    P=vec3(r*cos(a),r*sin(a),g.z*.05); C=mix(dustC*.7,vec3(.5,.6,.75)*.3,q); S=.012; A*=dv;
  }else{
    // the last of the diffuse dust, fading as the system clears
    float r=.2+2.7*sqrt(r3.y);
    P=vec3(r*cos(a),r*sin(a),g.z*.03*(2.-q)); C=dustC*mix(.5,.12,q); A*=dv;
  }
  float core=close?0.:step(r2.y,.07);
  P=mix(P,g*mix(.13,.09,q),core);
  keep*=1.-core;
  C=mix(C,vec3(1.,.95,.8)*mix(.85,1.,q),core);
  float big=clamp(wm,1.,3.);
  S=mix(S,.035*big,core); A=mix(A,.85/pow(big,1.6),core);
  P.yz=rot(1.12)*P.yz;
}

void moonBirth(out vec3 P,out vec3 C,out float S,out float A){
  // The giant impact. A Mars-sized world (Theia) strikes the young Earth a glancing blow; the shock crosses the
  // planet and leaves it molten; debris is thrown into orbit, where faster inner orbits shear it into a disc;
  // what lies inside the Roche limit rains back, and the rest gathers into the Moon.
  // uMoon is this scene's own clock in seconds; the impact is at T0. Sizes are to scale (Theia about half of
  // Earth's width, the Moon a quarter); the Moon's orbit is drawn about where it formed, a few Earth radii out
  const float T0=3.2, RE=.5, RT=.26, RM=.135, RO=1.55, TILT=1.;
  float t=uMoon, after=t-T0, hit=step(0.,after);
  float phi=2.45;
  vec2 rh=vec2(cos(phi),sin(phi)), tg=vec2(-rh.y,rh.x);
  vec3 Ld=normalize(vec3(-.55,.3,.78));               // sunlight
  float kind=r3.z;
  float mth=1.3+.57*after;                             // where the Moon is on its orbit
  S=.03; A=.3;
  if(kind<.42){
    // the Earth
    vec3 d=normalize(hash33(s*17.3+w*5.1)-.5+vec3(1e-4));
    d.z=abs(d.z);
    vec3 qn=d; qn.yz=rot(-TILT)*qn.yz;                 // the frame of the collision: qn.z is the spin axis
    float lat=asin(clamp(qn.z,-1.,1.));
    float lon=atan(qn.y,qn.x)-t*.08-max(after,0.)*.22; // the blow leaves the planet spinning fast
    float tex=sin(lon*3.+2.*sin(lat*4.))*sin(lat*5.+lon)+.5*sin(lon*7.-lat*9.);
    float crack=smoothstep(.45,.9,.5+.4*tex);
    float day=smoothstep(-.3,.5,dot(d,Ld));
    vec3 young=vec3(.42,.34,.3)*(.25+.75*day)*(1.-crack)+vec3(.95,.3,.07)*crack;   // thin crust over magma
    float ang=acos(clamp(dot(qn,vec3(rh,0.)),-1.,1.));
    float ta=after-ang/1.3;                            // the shock takes a few seconds to cross the globe
    float molten=smoothstep(0.,.5,ta);
    vec3 hot=mix(vec3(1.35,1.1,.8),vec3(1.15,.48,.13),smoothstep(0.,5.,ta))*(.8+.2*tex);
    vec3 cooled=mix(vec3(1.,.36,.08),vec3(.2,.1,.08)*(.4+.6*day),1.-crack);
    hot=mix(hot,cooled,smoothstep(9.,24.,ta));
    C=mix(young,hot,molten)*mix(.45,1.,pow(d.z,.6));
    C+=vec3(1.3,1.2,1.)*hit*exp(-after*1.4)*exp(-ang*ang*1.6);
    P=d*RE*(1.+.03*molten*(1.-eo)+.006*g.x);
    S=.045; A=.16*max(d.z,.12);
    if(eo>0.){
      // the blue world it became: oceans, land, ice caps and weather (the continents are invented, not today's)
      vec3 e=qn; e.xy=rot(-t*.25)*e.xy;
      float land=sin(3.1*e.x+1.7)*sin(2.7*e.y+.4)*sin(2.3*e.z+1.1)+.5*sin(5.3*e.x-4.1*e.y+2.)*sin(4.7*e.z+3.3*e.y)
                +.25*sin(11.*e.x+9.*e.z)*sin(10.*e.y+1.);
      float isl=smoothstep(.16,.22,land);
      vec3 ground=mix(mix(vec3(.62,.5,.32),vec3(.24,.38,.16),smoothstep(.25,.5,land)*smoothstep(.85,.3,abs(lat))),vec3(.55,.45,.3),smoothstep(.7,1.,land));
      vec3 sea=mix(vec3(.03,.12,.38),vec3(.08,.32,.55),smoothstep(.0,.16,land));
      vec3 ec=mix(sea,ground,isl);
      ec=mix(ec,vec3(.92,.95,1.),smoothstep(1.1,1.25,abs(lat)+.06*sin(lon*5.)));
      vec3 wv=qn; wv.xy=rot(-t*.32)*wv.xy;
      float cl=.5+.5*sin(lat*9.+2.*sin(atan(wv.y,wv.x)*3.+lat*4.))*sin(atan(wv.y,wv.x)*5.+3.*wv.z+t*.05);
      cl=smoothstep(.55,.85,cl)+.6*exp(-lat*lat*60.)*smoothstep(.4,.8,.5+.5*sin(atan(wv.y,wv.x)*11.));
      ec=mix(ec,vec3(1.),clamp(cl,0.,.9));
      float dayE=smoothstep(-.12,.35,dot(d,Ld));
      vec3 lit=ec*mix(.04,1.,dayE)*mix(.55,1.,pow(d.z,.5));
      lit+=vec3(.25,.45,1.)*pow(1.-d.z,3.)*.8*dayE;          // the thin blue air at the edge
      C=mix(C,lit,eo);
      if(g.y>1.1){P=d*RE*1.035;C=mix(C,vec3(.3,.55,1.2)*pow(1.-d.z,2.)*dayE,eo);}
    }
  }else if(kind<.54){
    // Theia
    vec3 d=normalize(hash33(s*23.1+w*3.7)-.5+vec3(1e-4));
    d.z=abs(d.z);
    vec2 vel=normalize(-rh*.68+tg*.73);                // it strikes at about 45 degrees
    float back=max(-after,0.);
    vec2 c2=rh*(RE+RT*.5)-vel*(1.05*back+.05*back*back)+vel*RT*1.5*(1.-exp(-max(after,0.)*3.));
    vec3 c=vec3(c2,0.); c.yz=rot(TILT)*c.yz;
    float day=smoothstep(-.3,.5,dot(d,Ld));
    float tex=sin(d.x*9.+3.*d.y)*sin(d.y*11.-2.*d.z);
    C=mix(vec3(.5,.4,.34)*(.75+.25*tex)*(.2+.8*day),vec3(1.3,1.,.7),smoothstep(-.25,.15,after))*mix(.45,1.,pow(d.z,.6));
    P=c+d*RT*(1.-.6*smoothstep(0.,.6,after));
    S=.04; A=.16*max(d.z,.12)*(1.-smoothstep(.05,.8,after))*(1.-eo);
  }else if(kind<.94){
    // the debris
    float ta=after-r3.x*.5;
    float rf=.62+1.5*pow(r2.x,1.4);
    float e1=1.-exp(-max(ta,0.)/(.5+.6*r2.y));
    float r=mix(RE*1.02,rf,e1);
    float th=phi+g.x*.2+.7*e1+1.1*max(ta,0.)/pow(rf,1.5);    // inner orbits run ahead: the plume winds into a disc
    float zh=g.z*.05*r*(1.+2.*exp(-max(ta,0.)));
    C=mix(vec3(1.3,1.1,.8),vec3(1.,.4,.12),smoothstep(0.,3.,ta))*mix(1.,.5,smoothstep(3.,9.,ta))*(.6+.6*r3.y);
    S=.022; A=.3*step(0.,ta);
    vec3 mo=vec3(0.);
    if(r2.z<.3&&rf>1.){
      // beyond the Roche limit the debris can hold together: it gathers into the Moon
      float tm=4.+5.*r3.y;
      float arrive=max(smoothstep(tm,tm+2.5,ta),eo);
      float da=mod(th-mth+PI,TAU)-PI;
      th=mth+da*(1.-arrive); r=mix(r,RO,arrive); zh*=1.-arrive;
      vec3 dm=normalize(hash33(s*31.7+w*2.3)-.5+vec3(1e-4));
      dm.z=abs(dm.z);
      float day=smoothstep(-.3,.5,dot(dm,Ld));
      float mtex=sin(dm.x*13.+4.*dm.y)*sin(dm.y*15.-3.*dm.x);
      float mare=smoothstep(.15,.45,sin(dm.x*4.+1.)*sin(dm.y*3.5+.5)+.45*sin(dm.z*6.+dm.x*2.));
      vec3 grey=mix(vec3(.72,.7,.68),vec3(.33,.33,.35),mare*eo)*(.75+.25*mtex)*(.12+.88*day);
      vec3 mc=mix(vec3(1.2,.62,.24),grey,max(smoothstep(11.,24.,after),eo));
      C=mix(C,mc*mix(.45,1.,pow(dm.z,.6)),arrive);
      S=mix(S,.032,arrive); A=mix(A,.07*max(dm.z,.12),arrive);
      mo=dm*RM*arrive;
    }else{
      // inside it, or left over: the debris rains back onto the Earth or thins away
      float tf=5.+9.*r3.y;
      float fall=max(smoothstep(tf,tf+4.,ta),eo);
      r=mix(r,rf<1.?RE*.98:r,fall); A*=1.-fall;
    }
    P=vec3(r*cos(th),r*sin(th),zh);
    P.yz=rot(TILT)*P.yz;
    P+=mo;
    if(P.z<0.&&length(P.xy)<RE)A=0.;                   // hidden behind the Earth
  }else{
    // far stars
    P=vec3((r2.xy-.5)*vec2(11.,7.),-2.-3.*r3.x);
    C=mix(vec3(.6,.7,1.),vec3(1.,.85,.7),r3.y)*.5; S=.012; A=.3;
  }
}

void redGiant(out vec3 P,out vec3 C,out float S,out float A){
  // a red giant, modelled on direct images like that of pi1 Gruis: a surface of a few enormous boiling
  // convection cells, darker and redder towards the edge; shells of shed gas drift outward, faint and dusty
  if(r2.y<.5){
    vec3 d=normalize(hash33(s*17.3+w*5.1)-.5+vec3(1e-4));
    d.z=abs(d.z);                         // only the face towards us; the far side is hidden behind the star
    float R=1.3*gr*(1.+.03*sin(uTime*.5)+.02*sin(uTime*1.9));
    P=d*R*(1.+.012*g.x);
    vec3 q=d; q.xz=rot(uTime*.02)*q.xz;
    float t=uTime*.07;
    float cells=sin(3.2*q.x+1.6*sin(2.2*q.y+t))*sin(3.0*q.y+1.8*sin(2.5*q.z-t))*sin(2.8*q.z+1.5*sin(2.*q.x+t*.7));
    cells=.5+.5*cells+.12*sin(9.*q.x+7.*q.y-t*2.)*sin(8.*q.z-6.*q.x+t);
    float mu=d.z;
    C=mix(vec3(.75,.12,.04),vec3(1.25,.6,.22),pow(mu,.6))*(.4+.8*smoothstep(.15,.9,cells))*mix(.35,1.,mu);
    S=.034; A=.6*max(mu,.12);            // even coverage across the disc, then darker towards the edge
    if(r2.y<.035){
      // the core: once the envelope thins, the bare, white-hot core shows through
      // the core: a bright heart that grows whiter and fiercer as the envelope thins and the bare core shows
      float bare=smoothstep(1.,.2,gr);
      P=g*mix(.3,.06,bare)*gr;
      C=mix(vec3(1.3,1.0,.6),vec3(1.1,1.2,1.5)*1.6,bare); S=mix(.07,.04,bare); A=mix(.05,.5,bare*bare);
    }
  }else{
    float sh=floor(r3.x*5.);
    float ph=fract(sh/5.+uTime*.012);
    float Rs=1.45+1.8*ph;
    vec3 d=normalize(g+vec3(1e-4));
    float patchy=smoothstep(.1,.7,.5+.5*sin(d.x*5.+sh)*sin(d.y*4.+d.z*3.+sh*2.));
    P=d*(Rs+g.x*.02);
    C=mix(vec3(1.,.5,.22),vec3(.4,.5,.8),ph)*(1.-ph)*.9*patchy;
    S=.024; A=.4*gsh;
    if(r3.y<.012){
      // Mars survives, scorched, just outside the star (same orbit and phase as in the worlds stage)
      float mph=PH[3]+uTime*.18/(pow(PR[3],1.5)+.05);
      P=vec3(1.67*cos(mph),1.67*sin(mph),0.)+g*.023;
      P.yz=rot(1.12)*P.yz;
      C=PC[3]*.8; S=.018; A=.1*gsh;
    }
    if(P.z<0.&&length(P.xy)<1.3*gr)A=0.;   // whatever is behind the star is hidden
  }
}

void nebulaEye(out vec3 P,out vec3 C,out float S,out float A){
  // a dying star's shed shell, read as an eye
  float a=s.y*TAU;
  float kind=r3.z;
  float Nf=220.;
  float fi=floor(s.y*Nf);
  float fr=hash13(vec3(fi,1.,2.));
  float lump=.13*sin(a*2.+.6)+.08*sin(a*5.+2.)+.05*sin(a*9.+uTime*.05);
  float r; S=.03; A=.42;
  if(kind<.02){
    P=g*.02; C=vec3(1.,1.08,1.3); S=.04; A=1.;
  }else if(kind<.14){
    r=.72*sqrt(s.x);
    P=vec3(r*cos(a),r*sin(a),g.z*.1);
    C=vec3(.04,.16,.42)*(.35+.5*r2.x);
  }else if(kind<.50){
    float r0=.66+.2*fr;
    r=r0+.75*pow(s.x,1.8);
    float ak=(fi+.5)/Nf*TAU+(r3.x-.5)*(.012+.05*(r-r0));
    P=vec3(r*cos(ak),r*sin(ak),g.z*.06);
    C=mix(vec3(.2,1.,.7),vec3(.1,.45,.9),smoothstep(0.,.7,r-r0))*(.45+.8*fr);
    S=.022; A=.5;
  }else if(kind<.90){
    r=1.55+lump+g.x*.3;
    P=vec3(r*cos(a),r*sin(a),g.z*.12);
    C=mix(vec3(1.,.55,.14),vec3(1.05,.1,.1),smoothstep(1.4,2.05,r));
    C=mix(vec3(.3,.95,.35),C,smoothstep(1.,1.5,r));
    C*=.55+.6*r2.x;
  }else{
    r=2.+lump+1.3*pow(s.x,1.5);
    P=vec3(r*cos(a),r*sin(a),g.z*.2);
    C=vec3(.85,.07,.09)*(1.-smoothstep(2.4,3.4,r))*.8;
  }
  P+=flow(P*2.2+fr,uTime*.15)*.035;
  P.x*=1.2;
  P.xy=rot(-.18)*P.xy;
}

void shape(int k,out vec3 P,out vec3 C,out float S,out float A){
  if(k==0)beginning(P,C,S,A);
  else if(k==ENERGY)energy(P,C,S,A);
  else if(k==WEB)web(P,C,S,A);
  else if(k==CLUSTER)protocluster(P,C,S,A);
  else if(k==QUASAR)youngGalaxy(P,C,S,A);
  else if(k==GALAXY)milkyWay(P,C,S,A);
  else if(k==HEART)heart(P,C,S,A);
  else if(k==NURSERY)nursery(P,C,S,A);
  else if(k==COLLAPSE)protostar(P,C,S,A);
  else if(k==FUSION)fusion(P,C,S,A);
  else if(k==STAR)youngStar(P,C,S,A);
  else if(k==JUPITER)jupiter(P,C,S,A);
  else if(k==MOON)moonBirth(P,C,S,A);
  else if(k==WORLDS)worlds(P,C,S,A);
  else if(k==GIANT)redGiant(P,C,S,A);
  else nebulaEye(P,C,S,A);
}

// where each zoom-in aims, in the coordinates of the scene being left
vec3 focus(int k){
  if(k==WEB)return webView(nodePos(vec3(0.)));
  if(k==CLUSTER)return FC;
  if(k==NURSERY)return vec3(PT[2],0.);   // the knot at the tip of the smallest pillar
  if(k==STAR){vec3 f=giantPlanetPos();f.yz=rot(1.12)*f.yz;return f;}   // the seed of the giant planet
  return vec3(0.);                       // the galaxy's centre; the newborn star's core
}

void main(){
  s=aSeed.xyz; w=aSeed.w;
  r2=hash33(s*91.7+w*13.1);
  r3=hash33(s.zxy*57.3+w*7.7);
  g=(r2+r3+hash33(s.yzx*33.1+w)-1.5)*1.15;

  float kf=min(floor(uT),__LAST__.);
  int k=int(kf);
  float z=clamp(uT-kf,0.,1.);
  float zs=z*z*(3.-2.*z);
  vec3 P,C; float S,A;
  vec3 Pa,Pb=vec3(0.),Ca,Cb=vec3(0.); float Sa,Sb=0.,Aa,Ab=0.;
  float hw=0.,hr=.6; vec3 hc=vec3(0.);

  // Every transition draws at most two scenes, a and b. First decide which, and the state each is drawn in;
  // the shapes are evaluated once each, below, which keeps the shader small and quick to compile
  bool outin=uZoom2!=0., zoom=uZoom!=0., first=uPass<.5;
  bool two=!(zoom||k==0);
  int ia=k, ib=k+1;
  float zz=zs;                                   // how far a zoom's camera move has gone
  // out and in again: pull back until the whole of a larger scene is in view, then dive to one place in it.
  // Before the turning point the two passes draw the scene we leave and the larger one;
  // after it, the larger one and the scene we arrive at
  int mid=int(uVia);
  float zr=z-.09*sin(TAU*z);                     // linger at the turning point
  bool outw=zr<.5;
  float za=smoothstep(0.,1.,clamp(zr*2.,0.,1.)), zb=smoothstep(0.,1.,clamp(zr*2.-1.,0.,1.));
  // Jupiter to the Moon's birth: the camera's path through the young system. It leaves the giant, swings past
  // its ringed neighbour, pulls back until every orbit is in view, then dives to the third world.
  // jc is where the camera looks and jlm the natural log of its magnification, in the system's own coordinates
  vec3 jc=vec3(0.),jp=vec3(0.),ep=vec3(0.); float jlm=0., ju=clamp(zr*2.,0.,1.);
  if(outin){
    ia=outw?(first?k:mid):(first?mid:k+1);
    if(k==JUPITER){
      jp=planetPos(4); ep=planetPos(2);
      float L0=log(.88);
      float hop=smoothstep(.03,.24,ju);          // the crossing from one giant to the next: back a little, then in again
      jlm=outw?mix(abs(uZoom)-1.7*sin(PI*hop),L0,smoothstep(.76,1.,ju)):mix(L0,uZoom2,zb);
      jc=outw?mix(mix(jp,planetPos(5),hop),vec3(0.),smoothstep(.78,.97,ju)):ep*smoothstep(.5,.75,zr);
      if(ia==mid){
        wq=.8*smoothstep(.1,.5,zr)+.2*smoothstep(.5,1.,zr);   // the rocky worlds are still gathering
        gf=1.; sat=outw?smoothstep(1.9,2.6,jlm):0.; dv=outw?1.-smoothstep(1.2,1.8,jlm):1.; jv=smoothstep(.1,.24,ju); wm=exp(jlm);
      }
    }
  }else if(zoom){
    ia=first?k:k+1;
    if(first){
      if(k==WEB)wfl=z*1.2;                         // matter streams into the node ahead
      if(k==GALAXY)gsp=2.2*zs;                     // the inner galaxy whirls faster as we close in
      if(k==NURSERY)kq=zs;                         // the knot contracts under its own weight
    }
    if(k==MOON){
      // before we leave, time races ahead: the Earth cools under its first oceans, the Moon greys
      if(first)eo=smoothstep(0.,.3,z);
      zz=smoothstep(.3,1.,z);
      if(!first)wm=exp(abs(uZoom)*(1.-zz));
    }
    if(k==COLLAPSE&&!first)fq=.35*smoothstep(.55,1.,z);
    if(k==STAR&&!first)jq=smoothstep(.4,1.,z);       // the giant takes shape as we arrive
    if(k==FUSION){
      // first the core heats and crowds until fusion is everywhere; only then do we pull back
      if(first)fq=mix(.35,1.,smoothstep(0.,.5,z));
      zz=smoothstep(.38,1.,z);
    }
  }else if(k==0){
    // the first expansion: fastest at the start, then slowing. At rest before it (z=0) there is nothing to see
    ia=ENERGY; bq=(1.-exp(-4.5*z))/(1.-exp(-4.5));
  }else if(k==GIANT){
    // the star pulses as it throws off its outer layers, and what is left shrinks to a white-hot core
    float pulse=.5+.5*cos((z-.08)/.0917*TAU);
    gr=mix(1.,.06,smoothstep(.08,.85,z))*(1.+.07*pulse*(1.-smoothstep(.6,.75,z)));
  }
  if(two&&k==QUASAR)mq=smoothstep(0.,.66,z);       // first the two galaxies dance and merge
  shape(ia,Pa,Ca,Sa,Aa);
  float kp=keep;
  mq=0.;
  wfl=0.;gsp=0.;kq=0.;fq=.35;jq=1.;wq=1.;bq=1.;gr=1.;gf=0.;sat=0.;jv=1.;dv=1.;wm=1.;eo=0.;
  float Rs=mix(.11,1.3,pow(zs,1.15));              // the swelling Sun's radius (worlds to red giant)
  if(two){
    if(k==WORLDS){gr=Rs/1.3;gsh=smoothstep(.74,1.,z);}
    if(k==QUASAR)gq=mix(.4,1.,smoothstep(.64,1.,z)); // after the merger, the turning disc (already wide) winds its arms
    shape(ib,Pb,Cb,Sb,Ab);
    gr=1.;gsh=1.;gq=1.;
  }
  float ig=wig;
  P=Pa;C=Ca;S=Sa;A=Aa;

  if(outin){
    float L1=abs(uZoom), L2=uZoom2, M=.88;
    vec3 home=mid==GALAXY?galaxyHome():vec3(0.);
    vec3 aim=home*smoothstep(.36,.74,zr);        // the place we will dive to drifts to the middle of the view
    float sc=M*exp(L1*(1.-za)+L2*zb);            // the size of the larger scene on screen
    if(k==JUPITER){
      float m=exp(jlm);
      if(ia==mid){P=(P-jc)*m;A*=outw?smoothstep(.03,.2,ju):1.-smoothstep(.55,.95,zb);}
      else if(outw){P=(jp-jc)*m+P*exp(jlm-L1);A*=1.-smoothstep(.1,.24,ju);}
      else{P=(ep-jc)*m+P*exp(jlm-L2);A*=smoothstep(.42,.85,zb);}
    }else if(ia==mid){
      P=(P-aim)*sc;
      A*=outw?smoothstep(.06,.5,za):1.-smoothstep(.55,.95,zb);
    }else if(outw){
      P=(P*exp(-L1)/M-aim)*sc;
      A*=1.-smoothstep(.5,.95,za);
    }else{
      P=(home-aim)*sc+P*exp(L2*(zb-1.));
      A*=smoothstep(.42,.85,zb);
    }
    if(k==HEART&&outw){hc=-aim*sc;hr=.6*exp(-L1*za);hw=1.-smoothstep(.5,.95,za);}
  }else if(zoom){
    // a true zoom: pass 0 draws the scene we leave, pass 1 the scene we arrive at
    float L=abs(uZoom);
    if(uZoom>0.){
      // fly towards the focus: the old scene streams past, the new one grows out of that point
      vec3 foc=focus(k);
      vec3 aim=foc*smoothstep(0.,.45,zz);
      float grow=exp(L*zz);
      if(first){P=(P-aim)*grow;A*=1.-smoothstep(.45,.9,zz);}
      else{P=(foc-aim)*grow+P*exp(L*(zz-1.));A*=smoothstep(.06,.5,zz);}
      if(k==HEART-1){hc=(foc-aim)*grow;hr=.6*exp(L*(zz-1.));hw=smoothstep(.06,.5,zz);}
    }else{
      // pull back: the old scene shrinks away, the new one arrives from beyond the camera
      vec3 off=(k==HEART?vec3(-2.4,1.2,0.):vec3(0.))*zz;
      if(k==MOON){
        // pull back from the Earth and its new Moon to their place on their orbit
        vec3 e3=planetPos(2);
        if(first){P=P*exp(-L*zz)+e3*zz;A*=1.-smoothstep(.45,.9,zz);}
        else{P=(P-e3)*exp(L*(1.-zz))+e3*zz;A*=smoothstep(.05,.5,zz);}
      }else if(first){P=P*exp(-L*zz)+off;A*=1.-smoothstep(.5,.95,zz);}
      else{P=P*exp(L*(1.-zz));A*=smoothstep(.05,.5,zz);}
      if(k==HEART){hc=off;hr=.6*exp(-L*zz);hw=1.-smoothstep(.5,.95,zz);}
    }
  }else if(k==0){
    // drawn above: the primordial energy at an earlier, denser moment; black until the first instant
    A*=step(1e-4,z);
  }else if(k==ENERGY){
    // gravity builds the web (the Zel'dovich approximation): every parcel of matter drifts in a straight line
    // from where it began towards the nearest filament or node, x = q + D psi. The growth D follows the clock:
    // while matter dominates, D grows as time^(2/3), so for most of the span little seems to happen and then
    // structure sharpens fast. Meanwhile the first glow cools out of sight (the dark ages), and about
    // 100 million years in, the first stars light the densest knots, then the filaments (cosmic dawn)
    vec3 q=Pa*mix(vec3(1.),vec3(2.7/uField.x,2.7/uField.y,1.2),smoothstep(0.,.7,z));   // the same matter, seen from further back
    float ease0=smoothstep(0.,.18,z);           // at rest (z=0) exactly the scene the opening arrived at
    q+=(flow(q*2.3+5.,0.)*.11+flow(q.zxy*4.1+2.,0.)*.05)*ease0;   // no two voids open alike
    float D=exp(-uGrow*(1.-z))*ease0;
    D=1.-pow(1.-D,1.5);                          // it settles as it arrives
    P=q+D*(Pb-q);
    float glow=1.-smoothstep(.02,.34,z);         // the afterglow reddens and fades as space stretches its light
    vec3 dark=vec3(.36,.3,.62)*.8;              // unlit gas, shown faintly so gravity's work can be seen
    float ti=.76+.14*ig+.03*w;
    float lit=smoothstep(ti,ti+.07,z);
    float flash=exp(-pow((z-ti-.04)/.045,2.));
    C=mix(dark,Ca*mix(vec3(1.),vec3(1.,.35,.2),smoothstep(0.,.3,z)),glow);
    C=mix(C,Cb,lit)+vec3(.45,.65,1.2)*flash*.7;
    S=mix(Sa,Sb,smoothstep(.05,.5,z));
    A=mix(mix(.36,Aa,glow),Ab,lit);
  }else if(k==WORLDS){
    // the Sun's far future: the star swells and reddens while we close in on the inner system.
    // Each orbit is swallowed as the surface reaches it; Mars is left just outside
    float Z=mix(1.,2.32,zs);
    Pa*=Z;
    float surf=step(r2.y,.5);
    float isCore=step(r2.y,.07);
    float eaten=max(1.-smoothstep(Rs-.1,Rs+.02,length(Pa)),isCore*smoothstep(0.,.12,z));
    eaten*=(1.-kp)*smoothstep(0.,.06,z);
    float gone=mix(smoothstep(.6,.74,z),smoothstep(.8,1.,z),kp);   // what is not swallowed slips out of the picture
    float back=smoothstep(.78,1.,z);
    float fpos=max(eaten,step(.76,z))*(1.-kp);
    Cb=mix(vec3(1.,.95,.8),Cb,smoothstep(.05,.55,z)*surf+(1.-surf));   // white, then orange, then red
    P=mix(Pa,Pb,fpos); S=mix(Sa,Sb,fpos); C=mix(Ca,Cb,fpos);
    A=mix(Aa*(1.-gone),Ab*mix(back,1.,eaten*surf),fpos);
  }else if(k==GIANT){
    // the layers leave in waves, outermost first, and the bare core's light makes the shed gas glow
    // from the inside out
    float rb=length(Pb.xy);
    float wave=floor((1.-clamp(rb/3.3,0.,1.))*6.)/6.;
    float te=.08+.55*wave+.04*w;
    float fi=ease((z-te)/.32);
    if(r2.y<.035)fi=ease((z-.85)/.15);          // the core stays at the centre, white-hot, to become the central star
    if(r2.y<.5)Ca=mix(Ca,vec3(.75,.88,1.25),smoothstep(.3,.85,z));
    float front=4.8*smoothstep(.5,1.,z);
    vec3 dull=vec3(.5,.22,.12)*.5*(.5+r2.x);
    Cb=mix(dull,Cb,smoothstep(rb-.25,rb+.25,front));
    P=mix(Pa,Pb,fi); C=mix(Ca,Cb,fi); S=mix(Sa,Sb,fi); A=mix(Aa,Ab,fi);
  }else{
    // a morph: each particle travels from its place in one shape to its place in the next
    float f=ease(z*1.5-.5*w);
    float swirl=1.;
    if(k==QUASAR){
      // the merged galaxy settles into a turning disc: every star circles the core the way the galaxy spins
      // (clockwise as we see it), drawing in as it goes, instead of flying straight across. Then the disc's
      // own differential rotation winds the arms into existence (milkyWay, through gq)
      f=ease((z-.62)*5.-.25*w);
      swirl=0.;
      float ra=length(Pa.xy), rb=length(Pb.xy);
      float ta=atan(Pa.y,Pa.x), tb=atan(Pb.y,Pb.x);
      float dth=mod(tb-ta,TAU)-TAU;               // always the clockwise way round
      float th=ta+dth*f, rr=mix(ra,rb,f);
      P=vec3(rr*cos(th),rr*sin(th),mix(Pa.z,Pb.z,f));
    }else P=mix(Pa,Pb,f);
    C=mix(Ca,Cb,f); S=mix(Sa,Sb,f); A=mix(Aa,Ab,f);
    float sw=sin(PI*f)*swirl;
    P+=flow(P*.9+w*3.,uTime*.5)*.16*sw;
    P.xy=rot(sw*(w-.35)*.9)*P.xy;
    C+=vec3(.25,.12,.3)*sw*r2.x;
  }

  float dist=uCam-P.z;
  float fo=2.1445;
  if(dist<.06||A<=0.){gl_Position=vec4(2.,2.,2.,1.);gl_PointSize=1.;vCol=vec3(0.);vA=0.;return;}
  gl_Position=vec4(P.x*fo/uAspect,P.y*fo+uShift*dist,0.,dist);
  float ps=S*uPx*fo*.5/dist;
  float ref=uPx*.012;
  vA=A*uAlpha*min(1.,pow(ref/ps,1.3));
  // the black hole's shadow hides anything behind it
  if(hw>0.&&P.z<hc.z-.005){
    float dh=uCam-hc.z;
    float sd=length(P.xy/dist-hc.xy/dh)*dh;
    vA*=1.-hw*(1.-smoothstep(hr*.93,hr,sd));
  }
  gl_PointSize=clamp(ps,1.,uPx*.07);
  vCol=C;
}`;

var FS=`#version 300 es
precision mediump float;
in vec3 vCol;
in float vA;
out vec4 o;
void main(){

  float r=dot(d,d)*4.;
  float gl=exp(-r*3.5)*(1.-smoothstep(.8,1.,r));
  o=vec4(vCol*vA*gl,1.);

var canvas=document.getElementById("c");

var prog=gl.createProgram();
